<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - ANONYMOUS PRO FINAL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =========================================
           CORE SYSTEM & THEME (AMOS STYLE)
           ========================================= */
        :root { 
            --matrix-color: #00ff9f; 
            --glow-effect: 0 0 15px rgba(0, 255, 159, 0.4);
        }
        
        body { 
            margin:0; font-family: 'Segoe UI', sans-serif; 
            background: #000; color: var(--matrix-color); 
            overflow:hidden; touch-action: manipulation; height: 100vh;
        }

        /* BG SYSTEM LAYERS */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
        .hacker-img { 
            position:absolute; top:0; left:0; width:100%; height:100%; 
            background-size:cover; background-position:center; 
            opacity:0; transition: opacity 1.5s ease-in-out; transform: scale(1.1);
        }
        .hacker-img.active { opacity:0.35; transform: scale(1.0); }
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.2; pointer-events:none; }

        /* UI ELEMENTS */
        #header { 
            position: fixed; top: 0; width: 100%; height: 55px; 
            background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--matrix-color); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px; z-index: 1000; box-sizing: border-box;
        }

        #sidebar { 
            position: fixed; left: -285px; top: 0; width: 270px; height: 100vh; 
            background: rgba(0,0,0,0.98); z-index: 3000; 
            transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); 
            padding: 30px 20px; box-sizing: border-box; border-right: 1px solid var(--matrix-color);
        }
        #sidebar.active { transform: translateX(285px); box-shadow: 15px 0 50px #000; }
        
        #sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2999; display: none;
        }
        #sidebar-overlay.active { display: block; }

        .nav-link { 
            padding: 16px; display: flex; align-items: center; gap: 15px; 
            border-radius: 12px; cursor: pointer; margin-bottom: 10px; 
            transition: 0.3s; border: 1px solid transparent;
        }
        .nav-link:active { background: rgba(0, 255, 159, 0.2); border-color: var(--matrix-color); }

        /* WINDOW SYSTEM */
        .window { 
            position:fixed; top:10%; left:3%; width:94%; height:82%; 
            background: rgba(0, 8, 5, 0.98); border: 1px solid var(--matrix-color); 
            display:none; flex-direction:column; z-index:100; border-radius: 18px; 
            overflow: hidden; backdrop-filter: blur(15px);
        }
        .titlebar { 
            background: rgba(0, 255, 159, 0.1); padding: 16px; 
            display:flex; justify-content:space-between; align-items:center; 
            border-bottom: 1px solid var(--matrix-color); font-weight:bold;
        }
        .window-content { flex:1; padding:18px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* PLAYER COMPONENTS */
        .player-controls { display: flex; justify-content: space-around; align-items: center; margin: 25px 0; }
        .p-btn { font-size: 22px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .p-btn.active { opacity: 1; color: #fff; text-shadow: var(--glow-effect); }
        
        .progress-box { width: 100%; height: 6px; background: #111; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        #prog-fill { height: 100%; background: var(--matrix-color); width: 0%; box-shadow: var(--glow-effect); }

        /* FLOATING PLAYER (DRAGABLE) */
        #floating-player { 
            position:fixed; bottom:100px; right:25px; width:65px; height:65px; 
            background:rgba(0,0,0,0.9); border:2px solid var(--matrix-color); 
            border-radius:50%; display:none; justify-content:center; align-items:center; 
            z-index:2500; cursor:grab; box-shadow: var(--glow-effect);
        }
        #floating-player i { font-size:28px; animation: disc-rotate 5s linear infinite; }
        @keyframes disc-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* LOGIN GATE */
        #login-gate { position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center; }
        input, button { background:#000; color:var(--matrix-color); border:1px solid var(--matrix-color); padding:14px; border-radius:10px; width:100%; font-weight:bold; margin-top: 10px; outline:none; }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=800')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?w=800')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div style="text-align:center; width:85%; max-width:320px;">
        <i class="fa-solid fa-fingerprint" style="font-size:60px; margin-bottom:20px;"></i>
        <input type="password" id="sys-pin" placeholder="SECURITY PIN" style="text-align:center; font-size:22px;">
        <button onclick="unlockSys()">ACCESS SYSTEM</button>
    </div>
</div>

<div id="header">
    <i class="fa-solid fa-bars-staggered" style="font-size:22px; cursor:pointer;" onclick="toggleSide()"></i>
    <span style="font-weight:bold; letter-spacing:4px;">AMOS OS <span style="color:#fff">V14</span></span>
    <span id="os-time" style="font-size:12px;">00:00</span>
</div>

<div id="sidebar-overlay" onclick="toggleSide()"></div>

<div id="sidebar">
    <div style="border-bottom: 1px solid var(--matrix-color); padding-bottom: 15px; margin-bottom: 25px;">
        <h3 style="margin:0;">SYSTEM MENU</h3>
    </div>
    <div class="nav-link" onclick="openW('musicWin')"><i class="fa-solid fa-music"></i> MEDIA PLAYER</div>
    <div class="nav-link" onclick="openW('scWin')"><i class="fa-brands fa-soundcloud"></i> SOUNDCLOUD</div>
    <div class="nav-link" onclick="openW('fileWin')"><i class="fa-solid fa-folder-open"></i> STORAGE</div>
    <div class="nav-link" onclick="location.reload()" style="color:red; margin-top: 50px;"><i class="fa-solid fa-power-off"></i> EXIT</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>AUDIO CENTER</span> <span onclick="closeW('musicWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <h3 id="track-title" style="text-align:center; color:#fff; margin-bottom:20px;">Select Track...</h3>
            <div class="progress-box" onclick="seek(event)"><div id="prog-fill"></div></div>
            <div class="player-controls">
                <i class="fa-solid fa-shuffle p-btn" id="shuf-btn" onclick="toggleShuf()"></i>
                <i class="fa-solid fa-backward" onclick="moveTrack(-1)"></i>
                <i class="fa-solid fa-circle-play" id="play-icon" onclick="toggleP()" style="font-size:65px; color:var(--matrix-color);"></i>
                <i class="fa-solid fa-forward" onclick="moveTrack(1)"></i>
                <i class="fa-solid fa-repeat p-btn" id="rep-btn" onclick="toggleRep()"></i>
            </div>
            <div id="song-list"></div>
            <input type="file" id="mUpload" style="display:none" onchange="upFile()">
            <button onclick="document.getElementById('mUpload').click()">UPLOAD MP3</button>
        </div>
    </div>

    <div class="window" id="scWin">
        <div class="titlebar"><span>SOUNDCLOUD ONLINE</span> <span onclick="closeW('scWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <div style="background:rgba(255,85,0,0.15); border:1px solid #ff5500; padding:20px; border-radius:15px; text-align:center;">
                <input type="text" id="sc-input-id" placeholder="Paste Track ID Here...">
                <button onclick="playSC()" style="background:#ff5500; color:#fff; border:none;">STREAM NOW</button>
            </div>
            <iframe id="sc-frame" style="width:100%; height:160px; border-radius:12px; border:none; margin-top:20px; display:none;" scrolling="no" frameborder="no" allow="autoplay"></iframe>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>FILES MANAGER</span> <span onclick="closeW('fileWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content" id="storage-list"></div>
    </div>
</div>

<div id="floating-player" onclick="toggleP()">
    <i class="fa-solid fa-compact-disc"></i>
</div>

<audio id="mainAudio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // --- AMOS OS CORE LOGIC ---
    function toggleSide() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('sidebar-overlay').classList.toggle('active'); 
    }
    function openW(id) { 
        document.getElementById(id).style.display = "flex"; 
        toggleSide(); 
        document.getElementById('floating-player').style.display = "none";
    }
    function closeW(id) { 
        document.getElementById(id).style.display = "none"; 
        if(!audio.paused) document.getElementById('floating-player').style.display = "flex";
    }
    function unlockSys() { 
        if(document.getElementById('sys-pin').value === "101312") { 
            document.getElementById('login-gate').style.display = "none"; 
            loadCloudData(); 
        } else { alert("ACCESS DENIED"); }
    }

    // --- MATRIX BG ENGINE ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, cols, drops = [];
    function initM() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; cols = Math.floor(w/15); drops = Array(cols).fill(1); }
    function runM() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#00ff9f"; ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*15, y*15);
            if(y*15 > h && Math.random() > 0.975) drops[i] = 0; drops[i]++;
        });
    }
    window.onresize = initM; initM(); setInterval(runM, 50);

    // BG ROTATION
    let bgImgs = document.querySelectorAll('.hacker-img'), bgI = 0;
    setInterval(() => { 
        bgImgs.forEach(img => img.classList.remove('active')); 
        bgImgs[bgI].classList.add('active'); bgI = (bgI+1)%bgImgs.length; 
    }, 5000);
    setInterval(() => { document.getElementById('os-time').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);

    // --- FIREBASE & MEDIA LOGIC ---
    const fbConfig = { apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0", authDomain: "amos-web-os.firebaseapp.com", projectId: "amos-web-os", storageBucket: "amos-web-os.firebasestorage.app", messagingSenderId: "59843745100", appId: "1:59843745100:web:b29e5996052a3bf5672be9" };
    firebase.initializeApp(fbConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("mainAudio");

    let songs = [], sIdx = 0, shuf = false, rep = false;

    function toggleShuf() { shuf = !shuf; document.getElementById('shuf-btn').classList.toggle('active'); }
    function toggleRep() { rep = !rep; document.getElementById('rep-btn').classList.toggle('active'); }

    function loadCloudData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const sList = document.getElementById("song-list");
            const stList = document.getElementById("storage-list");
            sList.innerHTML = ""; stList.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                if(d.type === 'audio') {
                    songs.push({id: doc.id, ...d});
                    // FITUR HAPUS LAGU (TRASH ICON)
                    sList.innerHTML += `
                        <div class="nav-link" onclick="playS('${doc.id}')" style="background:rgba(255,255,255,0.05); justify-content:space-between">
                            <span>${d.name}</span>
                            <i class="fa-solid fa-trash-can" style="color:#ff4d4d; padding:10px;" onclick="event.stopPropagation(); delSong('${doc.id}')"></i>
                        </div>`;
                }
                stList.innerHTML += `<div style="padding:15px; background:#111; border-radius:12px; margin-bottom:8px; border:1px solid #222">${d.name}</div>`;
            });
        });
    }

    function playS(id) { sIdx = songs.findIndex(s => s.id === id); startM(); }
    function startM() {
        const s = songs[sIdx]; audio.src = s.url; audio.play();
        document.getElementById("track-title").innerText = s.name;
        document.getElementById("play-icon").className = "fa-solid fa-circle-pause";
        document.getElementById('sc-frame').style.display = "none";
    }

    function toggleP() {
        if(audio.paused) { audio.play(); document.getElementById("play-icon").className = "fa-solid fa-circle-pause"; }
        else { audio.pause(); document.getElementById("play-icon").className = "fa-solid fa-circle-play"; }
    }

    function moveTrack(dir) {
        if(songs.length === 0) return;
        if(rep && dir === 1) {} 
        else if(shuf && dir === 1) { sIdx = Math.floor(Math.random()*songs.length); }
        else { sIdx = (sIdx + dir + songs.length) % songs.length; }
        startM();
    }

    function playSC() {
        const id = document.getElementById('sc-input-id').value;
        const fr = document.getElementById('sc-frame');
        if(!id) return;
        fr.src = `https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/${id}&color=%23ff5500&auto_play=true`;
        fr.style.display = "block"; audio.pause();
    }

    // --- SYSTEM ACTIONS (UPLOAD & DELETE) ---
    async function delSong(id) {
        if(confirm("Hapus lagu ini secara permanen dari Cloud?")) {
            await db.collection("files").doc(id).delete();
        }
    }

    async function upFile() {
        const f = document.getElementById("mUpload").files[0];
        const fd = new FormData(); fd.append("file", f); fd.append("upload_preset", "ml_default");
        try {
            const r = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: fd });
            const d = await r.json();
            await db.collection("files").add({ name: f.name, url: d.secure_url, type: "audio", created: Date.now() });
            alert("Upload Success!");
        } catch(e) { alert("Upload Failed!"); }
    }

    audio.onended = () => { if(rep) startM(); else moveTrack(1); };
    audio.ontimeupdate = () => { document.getElementById("prog-fill").style.width = (audio.currentTime/audio.duration)*100 + "%"; };
    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }

    // --- FLOATING PLAYER DRAG LOGIC (100% FIXED) ---
    const fl = document.getElementById('floating-player');
    let isD = false, xO = 0, yO = 0;

    fl.onmousedown = (e) => { isD = true; xO = e.clientX - fl.offsetLeft; yO = e.clientY - fl.offsetTop; fl.style.cursor = "grabbing"; };
    document.onmousemove = (e) => { 
        if(isD) { 
            fl.style.left = (e.clientX - xO) + "px"; 
            fl.style.top = (e.clientY - yO) + "px"; 
            fl.style.right = "auto"; fl.style.bottom = "auto"; 
        } 
    };
    document.onmouseup = () => { isD = false; fl.style.cursor = "grab"; };

    // MOBILE TOUCH DRAG
    fl.ontouchmove = (e) => {
        let t = e.touches[0];
        fl.style.left = (t.clientX - 32) + "px"; 
        fl.style.top = (t.clientY - 32) + "px";
        fl.style.right = "auto"; fl.style.bottom = "auto";
    };
</script>
</body>
</html>
