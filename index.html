<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - ANONYMOUS PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --matrix-color: #00ff9f; }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color: var(--matrix-color); overflow:hidden; touch-action: manipulation; }
        
        /* MULTI-LAYER BACKGROUND ENGINE */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
        .hacker-img { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0; transition: opacity 1s ease-in-out; }
        .hacker-img.active { opacity:0.3; } /* Transparansi agar Matrix tetap terlihat */
        
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.15; pointer-events:none; }
        
        /* INTERFACE & BUTTONS */
        button { cursor:pointer; background:rgba(0,0,0,0.8); color: var(--matrix-color); border:1px solid var(--matrix-color); padding:10px 15px; border-radius:8px; transition: 0.3s; font-size: 14px; font-weight: bold; }
        button:hover { background: var(--matrix-color); color:black; box-shadow: 0 0 15px var(--matrix-color); }
        input { background:rgba(0,0,0,0.7); color: var(--matrix-color); border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 10px; font-size: 16px; }

        /* WINDOWS SYSTEM */
        .window { position:fixed; top:12%; left:5%; width:90%; height:75%; background:rgba(0,5,5,0.95); border:1px solid rgba(0,255,159,0.3); display:none; flex-direction:column; z-index:100; border-radius: 15px; overflow: hidden; backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0,0,0,1); }
        .titlebar { background:rgba(0,255,159,0.1); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,255,159,0.15); font-weight:bold; }
        .window-content { flex:1; padding:15px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* MUSIC PLAYER */
        .progress-bar { width: 100%; height: 6px; background: #111; border-radius: 10px; cursor: pointer; margin: 10px 0; overflow: hidden; }
        #prog-fill { width: 0%; height: 100%; background: var(--matrix-color); }
        .active-icon { color: #fff !important; text-shadow: 0 0 10px var(--matrix-color); }

        /* FLOATING MUSIC PLAYER (Layaknya Bubble) */
        #floating-player { position:fixed; bottom:80px; right:20px; width:60px; height:60px; background:#000; border:2px solid var(--matrix-color); border-radius:50%; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:1500; cursor:grab; box-shadow: 0 0 15px var(--matrix-color); touch-action: none; }
        #floating-player:active { cursor:grabbing; }
        #floating-player i { font-size: 24px; color: var(--matrix-color); }
        #floating-progress { position:absolute; bottom:-5px; width:100%; height:4px; background: var(--matrix-color); border-radius:2px; display:none; }

        /* INTERFACE ELEMENTS */
        #header { position: fixed; top: 0; width: 100%; height: 55px; background: rgba(0,0,0,0.9); border-bottom: 1px solid rgba(0,255,159,0.2); display: flex; align-items: center; padding: 0 15px; z-index: 1000; justify-content: space-between; box-sizing: border-box; }
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100vh; background: #000; z-index: 2000; transition: 0.4s; padding: 25px; box-sizing: border-box; border-right: 1px solid var(--matrix-color); }
        #sidebar.active { left: 0; }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        .nav-link:active { background: rgba(0,255,159,0.15); }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 40px; border: 1px solid var(--matrix-color); border-radius: 20px; width: 85%; max-width: 320px; background: #000; }

        /* FILE GRID */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .file-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; text-align: center; position: relative; border: 1px solid transparent; }
        .file-item i { font-size: 35px; margin-bottom: 8px; display: block; }
        .file-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; color: #ccc; }

        @media (min-width: 768px) {
            .window { width: 700px; height: 500px; top: 60px; left: 280px; }
            #sidebar { left: 0; }
            #header { display: none; }
        }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://w0.peakpx.com/wallpaper/559/384/HD-wallpaper-anonymous-hacker-dark-darkness-guy-hacker-hoodie-mask-mask-hacker-suit-w-peakpx.jpg')"></div>
    <div class="hacker-img" style="background-image: url('https://w0.peakpx.com/wallpaper/189/663/HD-wallpaper-anonymous-hood-dark-man-hacker-guy-man-dark-night-light-peakpx.jpg')"></div>
    <div class="hacker-img" style="background-image: url('https://e1.pxfuel.com/desktop-wallpaper/680/468/desktop-wallpaper-cool-anonymous-hacker-mask-1080%C3%971920-hacker-phone-thumb.jpg')"></div>
    <div class="hacker-img" style="background-image: url('https://w0.peakpx.com/wallpaper/930/171/HD-wallpaper-man-mask-dark-guy-anonymous-peakpx.jpg')"></div>
    <div class="hacker-img" style="background-image: url('https://wallpapercave.com/wp/wp6658095.jpg')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-ghost" style="font-size: 50px; color: var(--matrix-color); margin-bottom: 20px;"></i>
        <h2 style="letter-spacing: 5px; font-size: 16px; margin-bottom: 30px; color: #fff;">AMOS ANONYMOUS v14</h2>
        <input type="password" id="sys-pin" placeholder="ENTER ACCESS PIN">
        <button onclick="unlock()" style="width: 100%;">ACCESS DENIED?</button>
    </div>
</div>

<div id="mobile-header">
    <i class="fa-solid fa-bars" onclick="document.getElementById('sidebar').classList.toggle('active')"></i>
    <span style="font-weight: bold; letter-spacing: 3px;">AMOS<span style="color:#fff;">_V14</span></span>
    <i class="fa-solid fa-microchip"></i>
</div>

<div id="sidebar">
    <div style="margin-bottom: 40px; border-bottom: 1px solid rgba(0,255,159,0.2); padding-bottom: 15px;">
        <h1 style="font-size: 18px; margin:0; color:#fff;">WE ARE<span style="color:var(--matrix-color);">_LEGION</span></h1>
        <small style="font-size: 10px; color:var(--matrix-color)">Premium Hacker Edition</small>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-headphones"></i> Music Center</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-box-open"></i> Storage Explorer</div>
    <div class="nav-link" onclick="location.reload()" style="margin-top: 50px; color: #ff4d4d;"><i class="fa-solid fa-user-xmark"></i> Logout</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>SPOTIFY ANONYMOUS</span> <span onclick="closeWin('musicWin')">✕</span></div>
        <div class="window-content">
            <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <input type="file" id="mFile" style="display:none" onchange="uploadTrack('file')">
                <div style="display: flex; gap: 8px;">
                    <button onclick="document.getElementById('mFile').click()" style="flex:1"><i class="fa-solid fa-upload"></i> ADD FILE</button>
                    <button onclick="addByLink()" style="flex:1"><i class="fa-solid fa-link"></i> ADD LINK</button>
                </div>
            </div>

            <div style="text-align:center;">
                <h3 id="track-name" style="margin: 0; font-size: 16px; color: #fff;">Select Track...</h3>
                <div class="progress-bar" onclick="seek(event)"><div id="prog-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--matrix-color)">
                    <span id="cur-t">0:00</span><span id="dur-t">0:00</span>
                </div>
                <div style="display: flex; justify-content:center; gap: 25px; margin: 15px 0; font-size: 24px;">
                    <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)" style="color: var(--matrix-color); cursor:pointer;"></i>
                    <i class="fa-solid fa-play-circle" id="play-btn" onclick="togglePlay()" style="color: var(--matrix-color); cursor:pointer; font-size: 45px;"></i>
                    <i class="fa-solid fa-forward-step" onclick="changeTrack(1)" style="color: var(--matrix-color); cursor:pointer;"></i>
                </div>
            </div>

            <h4 style="border-left: 3px solid var(--matrix-color); padding-left: 10px; margin-top: 25px;">PLAYLIST</h4>
            <div id="music-list"></div>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>CLOUD EXPLORER</span> <span onclick="closeWin('fileWin')">✕</span></div>
        <div class="window-content">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="file" id="fAny" style="display:none" onchange="uploadTrack('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:1">UPLOAD NEW</button>
                <button onclick="loadData()" style="flex:1">REFRESH</button>
            </div>
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>
</div>

<div id="floating-player" onclick="togglePlay()">
    <i class="fa-solid fa-music"></i>
    <div id="floating-progress"></div>
</div>

<div id="taskbar">
    <div>AMOS_OS</div>
    <div id="digitalClock">00:00:00</div>
</div>

<audio id="audioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // MATRIX & ANONYMOUS BG ENGINE
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, columns;
    const chars = "AMO_S_OS_ANONYMOUS_101312_LEGION_$+-*/=%#&";
    const fontSize = 15;
    let drops = [];

    function initMatrix() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00ff9f"; /* Tetap Hijau khas Matrix */
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    // Change Hacker Background every 5 seconds
    const hackerImgs = document.querySelectorAll('.hacker-img');
    let imgIdx = 0;
    function changeHackerBg() {
        hackerImgs.forEach(img => img.classList.remove('active'));
        hackerImgs[imgIdx].classList.add('active');
        imgIdx = (imgIdx + 1) % hackerImgs.length;
    }

    window.addEventListener('resize', initMatrix);
    initMatrix();
    setInterval(drawMatrix, 40);
    setInterval(changeHackerBg, 5000); // 5 Detik ganti gambar
    changeHackerBg(); // Load gambar pertama

    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audioEngine");

    let songs = [];
    let curIdx = 0;
    const playBtn = document.getElementById("play-btn");
    const floatingPlayer = document.getElementById("floating-player");
    const floatProg = document.getElementById("floating-progress");

    function unlock() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            loadData();
        } else { alert("ACCESS DENIED"); }
    }

    function openWin(id) { 
        document.getElementById(id).style.display = "flex"; 
        if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
        floatingPlayer.style.display = "none"; /* Sembunyikan bubble jika window buka */
    }
    function closeWin(id) { 
        document.getElementById(id).style.display = "none"; 
        if(!audio.paused) floatingPlayer.style.display = "flex"; /* Tampilkan bubble jika musik jalan */
    }

    function loadData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("file-grid");
            mList.innerHTML = ""; fGrid.innerHTML = "";

            snap.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                if(d.type === 'audio') {
                    songs.push({id, ...d});
                    mList.innerHTML += `
                        <div class="nav-link" onclick="playSong('${id}')" style="justify-content:space-between; background: rgba(255,255,255,0.01);">
                            <span><i class="fa-solid fa-play"></i> ${d.name}</span>
                            <i class="fa-solid fa-trash" style="color:#ff4d4d" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                        </div>`;
                }
                let icon = d.type === 'image' ? 'fa-file-image' : d.type === 'audio' ? 'fa-file-audio' : 'fa-file-pdf';
                fGrid.innerHTML += `
                    <div class="file-item" onclick="window.open('${d.url}')">
                        <i class="fa-solid ${icon}" style="color:var(--matrix-color)"></i>
                        <span class="file-name">${d.name}</span>
                        <i class="fa-solid fa-xmark del-file" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                    </div>`;
            });
        });
    }

    function playSong(id) { curIdx = songs.findIndex(s => s.id === id); start(); }
    function start() {
        const s = songs[curIdx];
        audio.src = s.url; audio.play();
        document.getElementById("track-name").innerText = s.name;
        playBtn.className = "fa-solid fa-pause-circle play-btn";
        floatingPlayer.style.display = "flex"; /* Tampilkan bubble */
        floatProg.style.display = "block";
    }

    function togglePlay() {
        if(audio.paused) { 
            if(audio.src) { audio.play(); playBtn.className = "fa-solid fa-pause-circle play-btn"; floatingPlayer.innerHTML = '<i class="fa-solid fa-pause"></i>'; }
        } else { 
            audio.pause(); playBtn.className = "fa-solid fa-play-circle play-btn"; floatingPlayer.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
    }

    function changeTrack(dir) {
        if(songs.length === 0) return;
        curIdx = (curIdx + dir + songs.length) % songs.length;
        start();
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
        document.getElementById("cur-t").innerText = fmt(audio.currentTime);
        document.getElementById("dur-t").innerText = fmt(audio.duration);
        floatProg.style.width = p + "%"; /* Update progress di bubble */
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }
    audio.onended = () => changeTrack(1);

    async function uploadTrack(mode) {
        const file = mode === 'file' ? document.getElementById("mFile").files[0] : document.getElementById("fAny").files[0];
        if(!file) return;
        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "pdf";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
            alert("Upload Success!");
        } catch(e) { alert("Upload Failed!"); }
    }

    async function addByLink() {
        const url = prompt("Direct URL MP3:");
        const name = prompt("Track Name:");
        if(url && name) await db.collection("files").add({ name: name, url: url, type: "audio", created: Date.now() });
    }

    async function deleteF(id) { if(confirm("Hapus?")) await db.collection("files").doc(id).delete(); }

    // Floating Player Drag Logic (Mobile & Desktop)
    let isDragging = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    floatingPlayer.addEventListener("touchstart", dragStart, false);
    floatingPlayer.addEventListener("touchend", dragEnd, false);
    floatingPlayer.addEventListener("touchmove", drag, false);

    floatingPlayer.addEventListener("mousedown", dragStart, false);
    floatingPlayer.addEventListener("mouseup", dragEnd, false);
    floatingPlayer.addEventListener("mousemove", drag, false);

    function dragStart(e) {
        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }
        if (e.target === floatingPlayer || floatingPlayer.contains(e.target)) { isDragging = true; }
    }

    function dragEnd(e) { initialX = currentX; initialY = currentY; isDragging = false; }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY, floatingPlayer);
        }
    }

    function setTranslate(xPos, yPos, el) { el.style.transform = "translate3d(" + xPos + "px, " + yPos + "px, 0)"; }

    setInterval(() => { document.getElementById("digitalClock").innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
