<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS WEB OS V14 PRO FINAL - MOBILE READY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* BASE SYSTEM THEME */
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color:#00ff9f; overflow:hidden; touch-action: manipulation; }
        #bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.1; pointer-events:none; }
        
        button { cursor:pointer; background:rgba(0,0,0,0.8); color:#00ff9f; border:1px solid #00ff9f; padding:10px 16px; border-radius:8px; transition: 0.3s; font-weight: bold; font-size: 14px; }
        input { background:#0a0a0a; color:#00ff9f; border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; font-size: 16px; }

        /* SIDEBAR (Responsive) */
        #sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100vh; background: #030303; border-right: 1px solid #00ff9f33; padding: 25px; z-index: 2000; transition: 0.3s; box-sizing: border-box; }
        #sidebar.active { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1500; }
        .overlay.active { display: block; }

        .menu-link { padding: 15px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; font-size: 15px; }
        .menu-link:hover { background: rgba(0,255,159,0.15); color: #fff; }

        /* WINDOW MANAGEMENT (Mobile Optimized) */
        .window { position:fixed; top:10%; left:5%; width:90%; height:80%; background:rgba(0,10,15,0.98); border:1px solid #00ff9f44; display:none; flex-direction:column; z-index:100; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border-radius: 20px; overflow: hidden; backdrop-filter: blur(20px); }
        .titlebar { background:rgba(0,255,159,0.1); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #00ff9f22; font-weight:bold; }
        .window-content { flex:1; padding:20px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* SPOTIFY UI (Mobile) */
        .music-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 15px; padding: 20px; background: linear-gradient(180deg, rgba(0,255,159,0.1) 0%, transparent 100%); border-radius: 15px; }
        .song-meta h2 { margin: 0; font-size: 20px; color: #fff; }
        
        .playback-bar { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
        .progress-bg { flex: 1; height: 5px; background: #222; border-radius: 10px; cursor: pointer; position: relative; }
        #progress-fill { height: 100%; width: 0%; background: #00ff9f; border-radius: 10px; }
        
        .main-controls { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
        .main-controls i { cursor: pointer; font-size: 24px; color: #00ff9f; }
        .play-trigger { font-size: 55px !important; }
        .active-mode { color: #fff !important; text-shadow: 0 0 10px #00ff9f; }

        /* FILE MANAGER (Mobile Grid) */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .file-box { text-align: center; padding: 15px 10px; border-radius: 12px; background: rgba(0,255,159,0.04); border: 1px solid #00ff9f11; position: relative; }
        .file-box i { font-size: 35px; margin-bottom: 10px; display: block; }
        .file-label { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        /* TASKBAR & MOBILE HEADER */
        #mobile-header { position: fixed; top: 0; width: 100%; height: 55px; background: #000; border-bottom: 1px solid #00ff9f33; display: flex; align-items: center; padding: 0 15px; z-index: 1000; box-sizing: border-box; justify-content: space-between; }
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 45px; background: #000; border-top: 1px solid #00ff9f22; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 1000; box-sizing: border-box; font-size: 12px; }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 30px; width: 85%; max-width: 320px; border: 1px solid #00ff9f44; border-radius: 20px; background: #050505; }

        @media (min-width: 768px) {
            #sidebar { left: 0; border-right: 1px solid #00ff9f1a; }
            #mobile-header { display: none; }
            .window { width: 700px; height: 500px; top: 60px; left: 280px; }
            .music-hero { flex-direction: row; text-align: left; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-unlock-keyhole" style="font-size: 40px; color: #00ff9f; margin-bottom: 20px;"></i>
        <h2 style="letter-spacing: 4px; font-size: 18px;">AMOS OS v14</h2>
        <input type="password" id="sys-pin" placeholder="PIN: 101312" style="margin-bottom: 20px; text-align: center;">
        <button onclick="unlockSystem()" style="width: 100%;">MASUK SISTEM</button>
    </div>
</div>

<div id="mobile-header">
    <i class="fa-solid fa-bars" style="font-size: 20px;" onclick="toggleSidebar()"></i>
    <span style="font-weight: bold; letter-spacing: 2px;">AMOS_OS</span>
    <i class="fa-solid fa-rotate" onclick="fetchData()"></i>
</div>

<div id="sidebar" id="sidebar">
    <div style="margin-bottom: 30px; border-bottom: 1px solid #00ff9f22; padding-bottom: 15px;">
        <h1 style="font-size: 18px; color: #fff; margin: 0;">AMOS<span style="color:#00ff9f;">_PRO</span></h1>
    </div>
    <div class="menu-link" onclick="toggleApp('musicApp'); toggleSidebar();"><i class="fa-solid fa-music"></i> Spotify Player</div>
    <div class="menu-link" onclick="toggleApp('fileApp'); toggleSidebar();"><i class="fa-solid fa-folder-open"></i> File Manager</div>
    <div class="menu-link" onclick="toggleApp('noteApp'); toggleSidebar();"><i class="fa-solid fa-terminal"></i> Terminal Notes</div>
    <div class="menu-link" onclick="location.reload()" style="margin-top: 40px; color: #ff4d4d;"><i class="fa-solid fa-power-off"></i> Exit System</div>
</div>

<div id="workspace">
    <div class="window" id="musicApp">
        <div class="titlebar"><span>SPOTIFY MOBILE</span> <span onclick="toggleApp('musicApp')">✕</span></div>
        <div class="window-content">
            <div class="music-hero">
                <div style="width: 100px; height: 100px; background: #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #00ff9f33;">
                    <i class="fa-solid fa-compact-disc fa-spin" style="font-size: 50px; color: #00ff9f;"></i>
                </div>
                <div class="song-meta">
                    <h2 id="cur-track-name">Pilih Lagu...</h2>
                    <p id="cur-track-status">Sistem Online</p>
                </div>
            </div>
            
            <div class="playback-bar">
                <span id="time-now" style="font-size: 10px;">0:00</span>
                <div class="progress-bg" onclick="scrubAudio(event)">
                    <div id="progress-fill"></div>
                </div>
                <span id="time-total" style="font-size: 10px;">0:00</span>
            </div>

            <div class="main-controls">
                <i class="fa-solid fa-shuffle" id="shuf-btn" onclick="setShuffle()"></i>
                <i class="fa-solid fa-backward-step" onclick="skipTrack(-1)"></i>
                <i class="fa-solid fa-circle-play play-trigger" id="master-toggle" onclick="handlePlayback()"></i>
                <i class="fa-solid fa-forward-step" onclick="skipTrack(1)"></i>
                <i class="fa-solid fa-repeat" id="rep-btn" onclick="setRepeat()"></i>
            </div>

            <div style="margin-top: 25px;">
                <h3 style="font-size: 14px; color: #00ff9f;">DAFTAR PUTAR</h3>
                <div id="playlist-view"></div>
            </div>
        </div>
    </div>

    <div class="window" id="fileApp">
        <div class="titlebar"><span>MANAGER FILE</span> <span onclick="toggleApp('fileApp')">✕</span></div>
        <div class="window-content">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="file" id="file-uploader" style="display: none;" onchange="startCloudUpload()">
                <button onclick="document.getElementById('file-uploader').click()" style="flex:1;">UPLOAD</button>
                <button onclick="fetchData()" style="flex:1;">REFRESH</button>
            </div>
            <div class="file-grid" id="file-grid-view"></div>
        </div>
    </div>
</div>

<div id="taskbar">
    <div><i class="fa-solid fa-wifi"></i> Online</div>
    <div id="sys-clock">00:00:00</div>
</div>

<audio id="audioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audioEngine");

    let trackList = [];
    let curIdx = 0;
    let isShuffle = false;
    let isRepeat = false;

    function unlockSystem() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            fetchData();
        } else { alert("PIN SALAH!"); }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function toggleApp(id) {
        const a = document.getElementById(id);
        const isOpen = a.style.display === "flex";
        document.querySelectorAll('.window').forEach(w => w.style.display = "none");
        a.style.display = isOpen ? "none" : "flex";
    }

    async function fetchData() {
        const snap = await db.collection("files").orderBy("created", "desc").get();
        trackList = [];
        const grid = document.getElementById("file-grid-view");
        const list = document.getElementById("playlist-view");
        grid.innerHTML = ""; list.innerHTML = "";

        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            if(data.type === 'audio') {
                trackList.push({id, ...data});
                list.innerHTML += `<div class="menu-link" onclick="playSelected('${id}')"><i class="fa-solid fa-play"></i> ${data.name}</div>`;
            }
            let icon = data.type === 'image' ? 'fa-file-image' : data.type === 'pdf' ? 'fa-file-pdf' : 'fa-file-audio';
            grid.innerHTML += `
                <div class="file-box" onclick="window.open('${data.url}')">
                    <i class="fa-solid ${icon}"></i>
                    <span class="file-label">${data.name}</span>
                    <i class="fa-solid fa-trash" style="position:absolute; top:5px; right:5px; color:red; font-size:10px;" onclick="event.stopPropagation(); deleteFile('${id}')"></i>
                </div>`;
        });
    }

    function playSelected(id) {
        curIdx = trackList.findIndex(t => t.id === id);
        loadTrack();
    }

    function loadTrack() {
        const track = trackList[curIdx];
        audio.src = track.url;
        audio.play();
        document.getElementById("cur-track-name").innerText = track.name;
        document.getElementById("master-toggle").className = "fa-solid fa-circle-pause play-trigger";
    }

    function handlePlayback() {
        if(audio.paused) { audio.play(); document.getElementById("master-toggle").className = "fa-solid fa-circle-pause play-trigger"; }
        else { audio.pause(); document.getElementById("master-toggle").className = "fa-solid fa-circle-play play-trigger"; }
    }

    function skipTrack(dir) {
        if(isShuffle && dir > 0) curIdx = Math.floor(Math.random() * trackList.length);
        else curIdx = (curIdx + dir + trackList.length) % trackList.length;
        loadTrack();
    }

    function setShuffle() { isShuffle = !isShuffle; document.getElementById("shuf-btn").classList.toggle("active-mode", isShuffle); }
    function setRepeat() { isRepeat = !isRepeat; audio.loop = isRepeat; document.getElementById("rep-btn").classList.toggle("active-mode", isRepeat); }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("progress-fill").style.width = p + "%";
        document.getElementById("time-now").innerText = fmt(audio.currentTime);
        document.getElementById("time-total").innerText = fmt(audio.duration);
    };

    function scrubAudio(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }

    async function startCloudUpload() {
        const file = document.getElementById("file-uploader").files[0];
        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("image") ? "image" : file.type.includes("pdf") ? "pdf" : "audio";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
            fetchData();
        } catch(e) { alert("Upload Gagal"); }
    }

    async function deleteFile(id) { if(confirm("Hapus file?")) { await db.collection("files").doc(id).delete(); fetchData(); } }

    setInterval(() => { document.getElementById("sys-clock").innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
