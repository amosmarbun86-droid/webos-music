<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - ANONYMOUS PRO FINAL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =========================================
           SYSTEM ROOT & ADVANCED THEME ENGINE
           ========================================= */
        :root { 
            --matrix-color: #00ff9f; 
            --glow-shadow: 0 0 25px rgba(0, 255, 159, 0.5);
            --bg-glass: rgba(0, 10, 5, 0.96);
            --accent-red: #ff4d4d;
            --sidebar-width: 280px;
        }
        
        body { 
            margin:0; font-family: 'Consolas', 'Courier New', monospace; 
            background: #000; color: var(--matrix-color); 
            overflow:hidden; touch-action: manipulation; height: 100vh;
            -webkit-user-select: none;
        }

        /* DYNAMIC BACKGROUND ENGINE */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
        .hacker-img { 
            position:absolute; top:0; left:0; width:100%; height:100%; 
            background-size:cover; background-position:center; 
            opacity:0; transition: opacity 2s ease-in-out; transform: scale(1.15);
        }
        .hacker-img.active { opacity:0.3; transform: scale(1.0); }
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.2; pointer-events:none; }

        /* UI HEADER ARCHITECTURE */
        #header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--matrix-color); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 25px; z-index: 1000; box-sizing: border-box;
            backdrop-filter: blur(15px); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .sys-status { display: flex; align-items: center; gap: 15px; font-size: 13px; }
        .pulse { width: 8px; height: 8px; background: var(--matrix-color); border-radius: 50%; box-shadow: var(--glow-shadow); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* SIDEBAR / MENU BAR (UPDATED CLOUDINARY BG) */
        #sidebar { 
            position: fixed; left: calc(var(--sidebar-width) * -1.1); top: 0; width: var(--sidebar-width); height: 100vh; 
            z-index: 3000; 
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 40px 25px; box-sizing: border-box; 
            border-right: 1px solid var(--matrix-color);
            background-image: url('https://res.cloudinary.com/dkisbfx29/image/upload/v1777526733/nkiwvrz7xpxqbqvaunn5.png'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        
        #sidebar::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,20,10,0.7) 100%);
            backdrop-filter: blur(5px);
            z-index: 0;
        }

        #sidebar.active { transform: translateX(calc(var(--sidebar-width) + 10px)); box-shadow: 20px 0 60px rgba(0,0,0,0.9); }
        
        #sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2999; display: none; backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }
        #sidebar-overlay.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-link { 
            padding: 18px; display: flex; align-items: center; gap: 18px; 
            border-radius: 15px; cursor: pointer; margin-bottom: 15px; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0, 255, 159, 0.1);
            background: rgba(0, 0, 0, 0.4); color: #fff;
            position: relative; z-index: 1;
        }
        .nav-link:hover, .nav-link:active { 
            background: rgba(0, 255, 159, 0.15); border-color: var(--matrix-color); 
            transform: translateX(10px); color: var(--matrix-color);
        }

        /* WINDOWS ARCHITECTURE */
        .window { 
            position:fixed; top:8%; left:3%; width:94%; height:84%; 
            background: var(--bg-glass); border: 1px solid var(--matrix-color); 
            display:none; flex-direction:column; z-index:100; border-radius: 25px; 
            overflow: hidden; backdrop-filter: blur(30px); 
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            animation: winOpen 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes winOpen { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .titlebar { 
            background: rgba(0, 255, 159, 0.08); padding: 20px 25px; 
            display:flex; justify-content:space-between; align-items:center; 
            border-bottom: 1px solid var(--matrix-color); font-weight:bold; letter-spacing: 2px;
        }
        .window-content { flex:1; padding:25px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* ADVANCED FILE MANAGER */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; }
        .file-item { 
            background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; 
            text-align: center; border: 1px solid rgba(0,255,159,0.05); 
            position: relative; transition: 0.3s;
        }
        .file-item:active { transform: translateY(-5px); background: rgba(0,255,159,0.08); }
        .file-item i { font-size: 40px; margin-bottom: 12px; display: block; }
        .file-name { font-size: 11px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* MUSIC ENGINE COMPONENTS */
        .music-card { background: rgba(0,0,0,0.5); padding: 30px; border-radius: 25px; border: 1px solid rgba(0,255,159,0.2); margin-bottom: 25px; }
        .progress-container { width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 25px 0; cursor: pointer; position: relative; }
        #prog-fill { height: 100%; background: linear-gradient(90deg, var(--matrix-color), #fff); width: 0%; border-radius: 10px; box-shadow: var(--glow-shadow); }
        .controls { display: flex; justify-content: center; align-items: center; gap: 40px; margin: 10px 0; }
        .c-btn { font-size: 26px; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.5); }
        .c-btn.active { color: var(--matrix-color); text-shadow: var(--glow-shadow); opacity: 1; }
        #play-btn { font-size: 70px; color: var(--matrix-color); }

        /* FLOATING COMPONENT */
        #floating-player { 
            position:fixed; bottom:30px; right:30px; width:75px; height:75px; 
            background:rgba(0,0,0,0.95); border:2px solid var(--matrix-color); 
            border-radius:50%; display:none; justify-content:center; align-items:center; 
            z-index:2500; cursor:move; box-shadow: var(--glow-shadow);
        }
        #floating-player i { font-size:32px; animation: disc-spin 3s linear infinite; }
        @keyframes disc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* SECURITY TERMINAL */
        #login-gate { position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center; }
        .login-box { text-align:center; width:85%; max-width:350px; padding:50px; border:1px solid var(--matrix-color); border-radius:30px; box-shadow: var(--glow-shadow); }
        input { background:rgba(0,255,159,0.05); color:var(--matrix-color); border:1px solid var(--matrix-color); padding:18px; border-radius:15px; width:100%; font-weight:bold; margin-top: 20px; outline:none; text-align:center; font-size: 16px; }
        button { background:var(--matrix-color); color:#000; border:none; padding:18px; border-radius:15px; width:100%; font-weight:900; margin-top: 20px; cursor:pointer; font-size: 14px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1510511459019-5dee99c43f20?w=1000')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-user-shield" style="font-size:70px; margin-bottom:25px; color:var(--matrix-color)"></i>
        <h2 style="letter-spacing:5px; font-size:20px; margin:0;">ACCESS CONTROL</h2>
        <p style="font-size: 10px; opacity: 0.6; margin-top: 5px;">ENTER BIOMETRIC PIN</p>
        <input type="password" id="sys-pin" placeholder="****">
        <button onclick="checkAuth()">INITIATE SYSTEM</button>
    </div>
</div>

<div id="header">
    <div class="sys-status" onclick="toggleSidebar()" style="cursor:pointer">
        <i class="fa-solid fa-bars-staggered" style="font-size:26px;"></i>
        <div class="pulse"></div>
        <span style="font-weight:bold; letter-spacing:3px;">SYSTEM_ACTIVE</span>
    </div>
    <div style="text-align:center">
        <span style="font-weight:900; letter-spacing:5px; font-size:16px;">AMOS_OS <span style="color:#fff">V14</span></span>
    </div>
    <span id="clock" style="font-family:monospace; font-size:15px; width:100px; text-align:right;">00:00:00</span>
</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <div style="border-bottom: 1px solid var(--matrix-color); padding-bottom: 25px; margin-bottom: 35px; position:relative; z-index: 1;">
        <h3 style="margin:0; color:#fff; letter-spacing:2px;">CORE_V14</h3>
        <small style="color:var(--matrix-color); opacity: 0.8;">User: Amos Rosario</small>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-compact-disc"></i> MUSIC_ENGINE</div>
    <div class="nav-link" onclick="openWin('scWin')"><i class="fa-brands fa-soundcloud"></i> CLOUD_PLAYER</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-database"></i> STORAGE_V2</div>
    <div class="nav-link" onclick="location.reload()" style="color:var(--accent-red); margin-top: 80px;"><i class="fa-solid fa-power-off"></i> SYSTEM_EXIT</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span><i class="fa-solid fa-play"></i> AUDIO_TERMINAL</span> <span onclick="closeWin('musicWin')" style="cursor:pointer; font-size:24px;">✕</span></div>
        <div class="window-content">
            <div class="music-card">
                <h2 id="track-name" style="text-align:center; color:#fff; margin:0 0 10px 0; font-size:18px;">Offline</h2>
                <p id="track-status" style="text-align:center; font-size:12px; margin-bottom:20px; opacity:0.6;">Ready to engage</p>
                <div class="progress-container" onclick="handleSeek(event)"><div id="prog-fill"></div></div>
                <div class="controls">
                    <i class="fa-solid fa-shuffle c-btn" id="shuf-icon" onclick="toggleShuffle()"></i>
                    <i class="fa-solid fa-backward-step c-btn" style="opacity:1" onclick="skipTrack(-1)"></i>
                    <i class="fa-solid fa-circle-play" id="play-btn" onclick="togglePlayback()"></i>
                    <i class="fa-solid fa-forward-step c-btn" style="opacity:1" onclick="skipTrack(1)"></i>
                    <i class="fa-solid fa-repeat c-btn" id="rep-icon" onclick="toggleRepeat()"></i>
                </div>
            </div>
            <div id="music-list"></div>
            <input type="file" id="mUp" style="display:none" onchange="upload('audio')">
            <button onclick="document.getElementById('mUp').click()" style="background:transparent; border:2px dashed var(--matrix-color); color:var(--matrix-color); font-weight:normal;">+ DEPLOY NEW AUDIO_FILE</button>
        </div>
    </div>

    <div class="window" id="scWin">
        <div class="titlebar"><span>SOUNDCLOUD_STREAM</span> <span onclick="closeWin('scWin')" style="cursor:pointer; font-size:24px;">✕</span></div>
        <div class="window-content">
            <div style="background:rgba(255,85,0,0.1); border:1px solid #ff5500; padding:35px; border-radius:25px; text-align:center;">
                <i class="fa-brands fa-soundcloud" style="font-size:60px; color:#ff5500; margin-bottom:20px;"></i>
                <input type="text" id="sc-id" placeholder="Paste SoundCloud Track ID" style="border-color:#ff5500; background:rgba(255,85,0,0.05); color:#fff">
                <button onclick="loadSC()" style="background:#ff5500; color:#fff;">ENGAGE STREAM</button>
            </div>
            <iframe id="sc-frame" style="width:100%; height:180px; border-radius:20px; border:none; margin-top:30px; display:none;" scrolling="no" frameborder="no" allow="autoplay"></iframe>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span><i class="fa-solid fa-server"></i> DATA_ARCHIVE_V2</span> <span onclick="closeWin('fileWin')" style="cursor:pointer; font-size:24px;">✕</span></div>
        <div class="window-content">
            <div style="display:flex; gap:15px; margin-bottom:30px;">
                <input type="file" id="fAny" style="display:none" onchange="upload('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:2">UPLOAD_DATA</button>
                <button onclick="sync()" style="flex:1; background:rgba(255,255,255,0.1); color:#fff;"><i class="fa-solid fa-sync"></i></button>
            </div>
            <div class="file-grid" id="main-grid"></div>
        </div>
    </div>
</div>

<div id="floating-player" onclick="togglePlayback()">
    <i class="fa-solid fa-compact-disc"></i>
</div>

<audio id="audioCore"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    /* SYSTEM CORE LOGIC */
    const config = { 
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0", 
        authDomain: "amos-web-os.firebaseapp.com", 
        projectId: "amos-web-os", 
        storageBucket: "amos-web-os.firebasestorage.app", 
        messagingSenderId: "59843745100", 
        appId: "1:59843745100:web:b29e5996052a3bf5672be9" 
    };
    firebase.initializeApp(config);
    const db = firebase.firestore();
    const audio = document.getElementById("audioCore");

    function checkAuth() {
        if(document.getElementById('sys-pin').value === "101312") {
            document.getElementById('login-gate').style.animation = "fadeOut 0.5s forwards";
            setTimeout(() => { 
                document.getElementById('login-gate').style.display = "none";
                sync();
            }, 500);
        } else { alert("ACCESS DENIED: INVALID BIOMETRIC"); }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function openWin(id) {
        document.getElementById(id).style.display = "flex";
        toggleSidebar();
        document.getElementById('floating-player').style.display = "none";
    }

    function closeWin(id) {
        document.getElementById(id).style.display = "none";
        if(!audio.paused) document.getElementById('floating-player').style.display = "flex";
    }

    /* CLOCK & MATRIX ENGINE */
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);

    const cvs = document.getElementById('bgCanvas');
    const ctx = cvs.getContext('2d');
    let w, h, cols, drops = [];
    function init() { w = cvs.width = window.innerWidth; h = cvs.height = window.innerHeight; cols = Math.floor(w/20); drops = Array(cols).fill(1); }
    function matrix() {
        ctx.fillStyle = "rgba(0,0,0,0.08)"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#00ff9f"; ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            const char = String.fromCharCode(0x30A0 + Math.random() * 96);
            ctx.fillText(char, i*20, y*20);
            if(y*20 > h && Math.random() > 0.98) drops[i] = 0; drops[i]++;
        });
    }
    window.onresize = init; init(); setInterval(matrix, 50);

    /* BACKGROUND SLIDESHOW */
    let bgs = document.querySelectorAll('.hacker-img'), bIdx = 0;
    setInterval(() => { bgs.forEach(b => b.classList.remove('active')); bgs[bIdx].classList.add('active'); bIdx = (bIdx+1)%bgs.length; }, 7000);

    /* DATA SYNC & CLOUD STORAGE */
    let playlist = [], cIdx = 0, isRep = false;

    function sync() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            playlist = [];
            const mList = document.getElementById("music-list");
            const grid = document.getElementById("main-grid");
            mList.innerHTML = ""; grid.innerHTML = "";
            
            snap.forEach(doc => {
                const d = doc.data(); const id = doc.id;
                if(d.type === 'audio') {
                    playlist.push({id, ...d});
                    mList.innerHTML += `<div class="nav-link" onclick="playMusic('${id}')" style="background:rgba(255,255,255,0.02); justify-content:space-between"><span><i class="fa-solid fa-play"></i> ${d.name}</span><i class="fa-solid fa-trash" style="color:red; padding:10px;" onclick="event.stopPropagation(); del('${id}')"></i></div>`;
                }
                let icon = "fa-file-code", color = "#00ff9f";
                if(d.type === 'image') { icon = "fa-file-image"; color = "#00d4ff"; }
                else if(d.type === 'audio') { icon = "fa-file-audio"; color = "#ffcc00"; }
                grid.innerHTML += `<div class="file-item" onclick="window.open('${d.url}')"><i class="fa-solid ${icon}" style="color:${color}"></i><span class="file-name">${d.name}</span><i class="fa-solid fa-xmark" style="position:absolute; top:8px; right:8px; color:red; font-size:12px;" onclick="event.stopPropagation(); del('${id}')"></i></div>`;
            });
        });
    }

    function playMusic(id) { cIdx = playlist.findIndex(s => s.id === id); startPlay(); }
    function startPlay() {
        const s = playlist[cIdx]; audio.src = s.url; audio.play();
        document.getElementById("track-name").innerText = s.name;
        document.getElementById("track-status").innerText = "STREAMING FROM AMOS_SERVER";
        document.getElementById("play-btn").className = "fa-solid fa-circle-pause";
        document.getElementById('floating-player').style.display = "flex";
    }

    function togglePlayback() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-circle-pause"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-circle-play"; }
    }

    function skipTrack(dir) {
        cIdx = (cIdx + dir + playlist.length) % playlist.length;
        startPlay();
    }

    function toggleRepeat() { isRep = !isRep; document.getElementById('rep-icon').classList.toggle('active'); }

    audio.onended = () => { if(isRep) audio.play(); else skipTrack(1); };
    audio.ontimeupdate = () => { document.getElementById("prog-fill").style.width = (audio.currentTime/audio.duration)*100 + "%"; };
    function handleSeek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }

    async function del(id) { if(confirm("DELETE PERMANENTLY?")) await db.collection("files").doc(id).delete(); }

    async function upload(mode) {
        const f = mode === 'audio' ? document.getElementById("mUp").files[0] : document.getElementById("fAny").files[0];
        if(!f) return;
        const fd = new FormData(); fd.append("file", f); fd.append("upload_preset", "ml_default");
        try {
            const r = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: fd });
            const d = await r.json();
            let type = f.type.includes("audio") ? "audio" : f.type.includes("image") ? "image" : "other";
            await db.collection("files").add({ name: f.name, url: d.secure_url, type: type, created: Date.now() });
            alert("DATA ENCRYPTED & SAVED");
        } catch(e) { alert("UPLOAD BREACHED"); }
    }

    function loadSC() {
        const id = document.getElementById('sc-id').value;
        const frame = document.getElementById('sc-frame');
        if(!id) return;
        frame.src = `https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/${id}&color=%23ff5500&auto_play=true&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true`;
        frame.style.display = "block";
    }

    /* DRAG ENGINE (MOBILE & PC) */
    const fl = document.getElementById('floating-player');
    let isD = false, xO, yO;
    const move = (e) => {
        let x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let y = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        if(isD) { fl.style.left = (x - xO) + "px"; fl.style.top = (y - yO) + "px"; fl.style.right = "auto"; fl.style.bottom = "auto"; }
    };
    fl.onmousedown = (e) => { isD = true; xO = e.clientX - fl.offsetLeft; yO = e.clientY - fl.offsetTop; };
    fl.ontouchstart = (e) => { isD = true; xO = e.touches[0].clientX - fl.offsetLeft; yO = e.touches[0].clientY - fl.offsetTop; };
    document.onmousemove = move; document.ontouchmove = move;
    document.onmouseup = () => isD = false; document.ontouchend = () => isD = false;

</script>
</body>
</html>
