<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - ANONYMOUS PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --matrix-color: #00ff9f; }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color: var(--matrix-color); overflow:hidden; touch-action: manipulation; }
        
        /* MULTI-LAYER BACKGROUND ENGINE */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; background: #000; }
        .hacker-img { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0; transition: opacity 1.5s ease-in-out; transform: scale(1.1); }
        .hacker-img.active { opacity:0.4; transform: scale(1.0); } /* Transparansi agar Matrix tetap terlihat */
        
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.25; pointer-events:none; }
        
        /* UI ELEMENTS */
        button { cursor:pointer; background:rgba(0,0,0,0.8); color: var(--matrix-color); border:1px solid var(--matrix-color); padding:10px 15px; border-radius:8px; transition: 0.3s; font-size: 14px; font-weight: bold; }
        button:hover { background: var(--matrix-color); color:black; box-shadow: 0 0 15px var(--matrix-color); }
        input { background:rgba(0,0,0,0.8); color: var(--matrix-color); border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 10px; font-size: 16px; }

        /* WINDOWS SYSTEM */
        .window { position:fixed; top:12%; left:5%; width:90%; height:75%; background:rgba(0,5,5,0.96); border:1px solid rgba(0,255,159,0.3); display:none; flex-direction:column; z-index:100; border-radius: 15px; overflow: hidden; backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(0,0,0,1); }
        .titlebar { background:rgba(0,255,159,0.15); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,255,159,0.2); font-weight:bold; }
        .window-content { flex:1; padding:15px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* FLOATING MUSIC PLAYER */
        #floating-player { position:fixed; bottom:100px; right:20px; width:65px; height:65px; background:rgba(0,0,0,0.9); border:2px solid var(--matrix-color); border-radius:50%; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:2000; cursor:move; box-shadow: 0 0 20px var(--matrix-color); touch-action: none; transition: transform 0.1s; }
        #floating-player i { font-size: 28px; color: var(--matrix-color); }
        #floating-progress { position:absolute; bottom:0; width:0%; height:4px; background: var(--matrix-color); border-radius:10px; }

        /* INTERFACE ELEMENTS */
        #header { position: fixed; top: 0; width: 100%; height: 55px; background: rgba(0,0,0,0.95); border-bottom: 1px solid rgba(0,255,159,0.3); display: flex; align-items: center; padding: 0 15px; z-index: 1000; justify-content: space-between; box-sizing: border-box; }
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100vh; background: #000; z-index: 3000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 25px; box-sizing: border-box; border-right: 1px solid var(--matrix-color); }
        #sidebar.active { left: 0; }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        .nav-link:active { background: rgba(0,255,159,0.2); }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 40px; border: 1px solid var(--matrix-color); border-radius: 20px; width: 85%; max-width: 320px; background: #000; box-shadow: 0 0 20px var(--matrix-color); }

        /* FILE GRID */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .file-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; position: relative; }
        .file-item i { font-size: 35px; margin-bottom: 8px; display: block; }
        .file-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; color: #ccc; }

        .progress-bar { width: 100%; height: 6px; background: #111; border-radius: 10px; cursor: pointer; margin: 10px 0; overflow: hidden; }
        #prog-fill { width: 0%; height: 100%; background: var(--matrix-color); box-shadow: 0 0 10px var(--matrix-color); }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1510511459019-5dee99c43f20?auto=format&fit=crop&q=80&w=1000')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-user-secret" style="font-size: 60px; color: var(--matrix-color); margin-bottom: 20px;"></i>
        <h2 style="letter-spacing: 5px; font-size: 16px; margin-bottom: 30px; color: #fff;">AMOS ANONYMOUS v14</h2>
        <input type="password" id="sys-pin" placeholder="ENTER ACCESS CODE">
        <button onclick="unlock()" style="width: 100%;">BOOT SYSTEM</button>
    </div>
</div>

<div id="header">
    <i class="fa-solid fa-bars" onclick="document.getElementById('sidebar').classList.toggle('active')"></i>
    <span style="font-weight: bold; letter-spacing: 3px; color: var(--matrix-color);">AMOS_OS</span>
    <i class="fa-solid fa-shield-halved"></i>
</div>

<div id="sidebar">
    <div style="margin-bottom: 40px; border-bottom: 1px solid rgba(0,255,159,0.3); padding-bottom: 15px;">
        <h1 style="font-size: 18px; margin:0; color:#fff;">LEGION<span style="color:var(--matrix-color);">_OS</span></h1>
        <small style="font-size: 10px; color:var(--matrix-color)">Secure Hacking Environment</small>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-compact-disc"></i> Music Player</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-folder-closed"></i> Storage</div>
    <div class="nav-link" onclick="location.reload()" style="margin-top: 50px; color: #ff4d4d;"><i class="fa-solid fa-power-off"></i> Exit</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>ANONYMOUS PLAYER</span> <span onclick="closeWin('musicWin')">✕</span></div>
        <div class="window-content">
            <div style="background: rgba(0,0,0,0.6); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0,255,159,0.1);">
                <input type="file" id="mFile" style="display:none" onchange="uploadTrack('file')">
                <div style="display: flex; gap: 8px;">
                    <button onclick="document.getElementById('mFile').click()" style="flex:1">FILE</button>
                    <button onclick="addByLink()" style="flex:1">LINK</button>
                </div>
            </div>

            <div style="text-align:center;">
                <h3 id="track-name" style="margin: 0; font-size: 16px; color: #fff;">Idle...</h3>
                <div class="progress-bar" onclick="seek(event)"><div id="prog-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--matrix-color)">
                    <span id="cur-t">0:00</span><span id="dur-t">0:00</span>
                </div>
                <div style="display: flex; justify-content:center; gap: 30px; margin: 15px 0; font-size: 28px;">
                    <i class="fa-solid fa-backward" onclick="changeTrack(-1)" style="cursor:pointer;"></i>
                    <i class="fa-solid fa-play-circle" id="play-btn" onclick="togglePlay()" style="cursor:pointer; font-size: 50px;"></i>
                    <i class="fa-solid fa-forward" onclick="changeTrack(1)" style="cursor:pointer;"></i>
                </div>
            </div>
            <div id="music-list" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>SYSTEM STORAGE</span> <span onclick="closeWin('fileWin')">✕</span></div>
        <div class="window-content">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="file" id="fAny" style="display:none" onchange="uploadTrack('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:1">UPLOAD</button>
                <button onclick="loadData()" style="flex:1">SYNC</button>
            </div>
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>
</div>

<div id="floating-player" onclick="togglePlay()">
    <i class="fa-solid fa-record-vinyl"></i>
    <div id="floating-progress"></div>
</div>

<audio id="audioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // MATRIX & BG ENGINE
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, columns;
    const chars = "01011010101ANONYMOUS_AMOS_V14";
    const fontSize = 18;
    let drops = [];

    function initMatrix() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00ff9f";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    const hackerImgs = document.querySelectorAll('.hacker-img');
    let imgIdx = 0;
    function changeHackerBg() {
        hackerImgs.forEach(img => img.classList.remove('active'));
        hackerImgs[imgIdx].classList.add('active');
        imgIdx = (imgIdx + 1) % hackerImgs.length;
    }

    window.addEventListener('resize', initMatrix);
    initMatrix();
    setInterval(drawMatrix, 50);
    setInterval(changeHackerBg, 5000);
    changeHackerBg();

    // FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audioEngine");

    let songs = [];
    let curIdx = 0;
    const floatingPlayer = document.getElementById("floating-player");
    const floatProg = document.getElementById("floating-progress");

    function unlock() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            loadData();
        } else { alert("ACCESS DENIED"); }
    }

    function openWin(id) { 
        document.getElementById(id).style.display = "flex"; 
        if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
        floatingPlayer.style.display = "none";
    }
    function closeWin(id) { 
        document.getElementById(id).style.display = "none"; 
        if(!audio.paused) floatingPlayer.style.display = "flex";
    }

    function loadData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("file-grid");
            mList.innerHTML = ""; fGrid.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                if(d.type === 'audio') {
                    songs.push({id: doc.id, ...d});
                    mList.innerHTML += `<div class="nav-link" onclick="playSong('${doc.id}')" style="justify-content:space-between; background:rgba(255,255,255,0.02)"><span><i class="fa-solid fa-play"></i> ${d.name}</span><i class="fa-solid fa-trash" style="color:red" onclick="event.stopPropagation(); deleteF('${doc.id}')"></i></div>`;
                }
                let icon = d.type === 'image' ? 'fa-file-image' : d.type === 'audio' ? 'fa-file-audio' : 'fa-file-pdf';
                fGrid.innerHTML += `<div class="file-item" onclick="window.open('${d.url}')"><i class="fa-solid ${icon}" style="color:var(--matrix-color)"></i><span class="file-name">${d.name}</span><i class="fa-solid fa-xmark" style="position:absolute; top:5px; right:5px; color:red" onclick="event.stopPropagation(); deleteF('${doc.id}')"></i></div>`;
            });
        });
    }

    function playSong(id) { curIdx = songs.findIndex(s => s.id === id); start(); }
    function start() {
        const s = songs[curIdx];
        audio.src = s.url; audio.play();
        document.getElementById("track-name").innerText = s.name;
        document.getElementById("play-btn").className = "fa-solid fa-pause-circle";
        floatingPlayer.style.display = "flex";
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-pause-circle"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-play-circle"; }
    }

    function changeTrack(dir) {
        if(songs.length === 0) return;
        curIdx = (curIdx + dir + songs.length) % songs.length;
        start();
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
        document.getElementById("cur-t").innerText = fmt(audio.currentTime);
        document.getElementById("dur-t").innerText = fmt(audio.duration);
        floatProg.style.width = p + "%";
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }
    audio.onended = () => changeTrack(1);

    // Upload Logic & Drag Logic (Disimpan dari file sebelumnya)
    async function uploadTrack(mode) {
        const file = mode === 'file' ? document.getElementById("mFile").files[0] : document.getElementById("fAny").files[0];
        if(!file) return;
        const form = new FormData();
        form.append("file", file); form.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "pdf";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
        } catch(e) { alert("Upload Gagal"); }
    }

    async function addByLink() {
        const url = prompt("Link MP3:");
        const name = prompt("Nama Lagu:");
        if(url && name) await db.collection("files").add({ name: name, url: url, type: "audio", created: Date.now() });
    }

    async function deleteF(id) { if(confirm("Hapus?")) await db.collection("files").doc(id).delete(); }

    // Floating Drag
    let isDrag = false, xOff = 0, yOff = 0;
    floatingPlayer.onmousedown = (e) => { isDrag = true; xOff = e.clientX - floatingPlayer.offsetLeft; yOff = e.clientY - floatingPlayer.offsetTop; };
    document.onmousemove = (e) => { if(isDrag) { floatingPlayer.style.left = (e.clientX - xOff) + "px"; floatingPlayer.style.top = (e.clientY - yOff) + "px"; floatingPlayer.style.right = "auto"; floatingPlayer.style.bottom = "auto"; } };
    document.onmouseup = () => isDrag = false;
    
    // Touch Drag for Mobile
    floatingPlayer.ontouchmove = (e) => {
        let touch = e.touches[0];
        floatingPlayer.style.left = (touch.clientX - 30) + "px";
        floatingPlayer.style.top = (touch.clientY - 30) + "px";
        floatingPlayer.style.right = "auto"; floatingPlayer.style.bottom = "auto";
    };
</script>
</body>
</html>
