<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - ANONYMOUS PRO FINAL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =========================================
           SYSTEM ROOT & THEME
           ========================================= */
        :root { 
            --matrix-color: #00ff9f; 
            --glow-color: rgba(0, 255, 159, 0.5);
            --bg-dark: #000000;
        }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: var(--matrix-color); 
            overflow: hidden; 
            touch-action: manipulation; 
            height: 100vh;
            -webkit-user-select: none;
        }

        /* =========================================
           HACKER BACKGROUND ENGINE
           ========================================= */
        #bg-system { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            overflow: hidden; 
        }

        .hacker-img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            transform: scale(1.1);
        }

        .hacker-img.active { 
            opacity: 0.35; 
            transform: scale(1.0);
        }

        #bgCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            opacity: 0.2; 
            pointer-events: none; 
        }

        /* =========================================
           NAVIGATION BAR (HEADER)
           ========================================= */
        #header { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            height: 60px; 
            background: rgba(0, 0, 0, 0.9); 
            border-bottom: 1px solid var(--matrix-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            z-index: 1000; 
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .menu-toggle-btn { 
            font-size: 24px; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .menu-toggle-btn:hover {
            text-shadow: 0 0 10px var(--matrix-color);
        }

        /* =========================================
           SIDEBAR SYSTEM (FIXED)
           ========================================= */
        #sidebar { 
            position: fixed; 
            left: -300px; 
            top: 0; 
            width: 280px; 
            height: 100vh; 
            background: rgba(0, 0, 0, 0.98); 
            z-index: 3000; 
            transition: transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1); 
            padding: 30px; 
            box-sizing: border-box; 
            border-right: 1px solid var(--matrix-color);
            transform: translateX(0);
        }

        #sidebar.active { 
            transform: translateX(300px); 
            box-shadow: 10px 0 50px #000;
        }

        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2999;
            display: none;
            backdrop-filter: blur(3px);
        }

        #sidebar-overlay.active {
            display: block;
        }

        .nav-link { 
            padding: 18px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            margin-bottom: 12px; 
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .nav-link:active { 
            background: rgba(0, 255, 159, 0.15); 
            border-color: var(--matrix-color); 
        }

        /* =========================================
           WINDOW MANAGER
           ========================================= */
        .window { 
            position: fixed; 
            top: 10%; 
            left: 4%; 
            width: 92%; 
            height: 80%; 
            background: rgba(0, 8, 5, 0.98); 
            border: 1px solid var(--matrix-color); 
            display: none; 
            flex-direction: column; 
            z-index: 100; 
            border-radius: 20px; 
            overflow: hidden; 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .titlebar { 
            background: rgba(0, 255, 159, 0.1); 
            padding: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--matrix-color); 
            font-weight: bold; 
        }

        .window-content { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        /* =========================================
           SOUNDCLOUD & PLAYER COMPONENTS
           ========================================= */
        .sc-input-wrapper {
            background: rgba(255, 85, 0, 0.05);
            border: 1px solid #ff5500;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
        }

        #sc-frame {
            width: 100%;
            height: 165px;
            border-radius: 15px;
            border: none;
            margin-top: 15px;
            display: none;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
        }

        .player-controls { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            margin: 30px 0; 
        }

        .control-btn { 
            font-size: 24px; 
            cursor: pointer; 
            opacity: 0.6; 
            transition: 0.3s; 
        }

        .control-btn.active { 
            opacity: 1; 
            color: #fff; 
            text-shadow: 0 0 10px var(--matrix-color); 
        }

        .progress-container { 
            width: 100%; 
            height: 8px; 
            background: #111; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            cursor: pointer; 
            overflow: hidden;
        }

        #prog-fill { 
            height: 100%; 
            background: var(--matrix-color); 
            width: 0%; 
            box-shadow: 0 0 10px var(--matrix-color); 
        }

        /* =========================================
           LOGIN SYSTEM UI
           ========================================= */
        #login-gate { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .login-box {
            text-align: center;
            width: 80%;
            max-width: 350px;
            padding: 40px;
            border: 1px solid var(--matrix-color);
            border-radius: 30px;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 30px var(--glow-color);
        }

        input { 
            background: #000; 
            color: var(--matrix-color); 
            border: 1px solid var(--matrix-color); 
            padding: 15px; 
            border-radius: 12px; 
            width: 100%; 
            font-weight: bold; 
            margin-top: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        button {
            background: var(--matrix-color);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=800')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?w=800')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1510511459019-5dee99c43f20?w=800')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-shield-halved" style="font-size: 60px; color: var(--matrix-color);"></i>
        <h2 style="letter-spacing: 5px; margin-top: 20px;">ACCESS DENIED</h2>
        <input type="password" id="sys-pin" placeholder="ENTER SYSTEM PIN">
        <button onclick="checkAccess()">AUTHORIZE</button>
    </div>
</div>

<div id="header">
    <i class="fa-solid fa-bars-staggered menu-toggle-btn" onclick="openSidebar()"></i>
    <span style="font-weight: bold; letter-spacing: 4px;">AMOS_OS <span style="color:#fff">V14</span></span>
    <span id="os-clock" style="font-family: monospace;">00:00:00</span>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="sidebar">
    <div style="border-bottom: 1px solid var(--matrix-color); padding-bottom: 20px; margin-bottom: 30px;">
        <h2 style="margin: 0; font-size: 20px; color: #fff;">CORE_MENU</h2>
        <small>System Administrator</small>
    </div>
    <div class="nav-link" onclick="handleWin('musicWin')"><i class="fa-solid fa-music"></i> MEDIA ENGINE</div>
    <div class="nav-link" onclick="handleWin('scWin')"><i class="fa-brands fa-soundcloud"></i> CLOUD STREAM</div>
    <div class="nav-link" onclick="handleWin('fileWin')"><i class="fa-solid fa-database"></i> SYSTEM DATA</div>
    <div class="nav-link" onclick="location.reload()" style="color: #ff4d4d; margin-top: 60px;"><i class="fa-solid fa-power-off"></i> SHUTDOWN</div>
</div>

<div id="workspace">
    
    <div class="window" id="musicWin">
        <div class="titlebar"><span><i class="fa-solid fa-compact-disc"></i> MUSIC PLAYER</span> <span onclick="closeWin('musicWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <h3 id="display-name" style="text-align: center; color: #fff; margin-bottom: 25px;">Ready to play...</h3>
            
            <div class="progress-container" onclick="handleSeek(event)">
                <div id="prog-fill"></div>
            </div>
            
            <div class="player-controls">
                <i class="fa-solid fa-shuffle control-btn" id="shuf-icon" onclick="toggleShuffleMode()"></i>
                <i class="fa-solid fa-backward-step control-btn" style="opacity:1" onclick="changeTrack(-1)"></i>
                <i class="fa-solid fa-circle-play" id="main-play-btn" onclick="handleToggle()" style="font-size: 65px; color: var(--matrix-color);"></i>
                <i class="fa-solid fa-forward-step control-btn" style="opacity:1" onclick="changeTrack(1)"></i>
                <i class="fa-solid fa-repeat control-btn" id="rep-icon" onclick="toggleRepeatMode()"></i>
            </div>

            <div id="local-list"></div>
            <input type="file" id="uploadInput" style="display:none" onchange="processUpload()">
            <button onclick="document.getElementById('uploadInput').click()" style="background:transparent; border:1px solid var(--matrix-color); color:var(--matrix-color)">UPLOAD MP3 TO CLOUD</button>
        </div>
    </div>

    <div class="window" id="scWin">
        <div class="titlebar"><span>SOUNDCLOUD ENGINE</span> <span onclick="closeWin('scWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <div class="sc-input-wrapper">
                <i class="fa-brands fa-soundcloud" style="font-size: 45px; color: #ff5500; margin-bottom: 15px;"></i>
                <input type="text" id="soundcloud-id-input" placeholder="TRACK ID (e.g. 173259837)">
                <button onclick="initSoundCloudStream()" style="background: #ff5500; color: white;">INITIALIZE STREAM</button>
            </div>
            <iframe id="sc-frame" scrolling="no" frameborder="no" allow="autoplay"></iframe>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>CLOUD STORAGE</span> <span onclick="closeWin('fileWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <button onclick="syncFiles()">REFRESH DATA</button>
            <div id="storage-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;"></div>
        </div>
    </div>

</div>

<audio id="coreAudioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    /* =========================================
       CORE SYSTEM JAVASCRIPT
       ========================================= */
    
    // UI Interactions
    function openSidebar() {
        document.getElementById('sidebar').classList.add('active');
        document.getElementById('sidebar-overlay').classList.add('active');
    }

    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    }

    function handleWin(id) {
        document.getElementById(id).style.display = "flex";
        closeSidebar();
    }

    function closeWin(id) {
        document.getElementById(id).style.display = "none";
    }

    function checkAccess() {
        const pin = document.getElementById('sys-pin').value;
        if(pin === "101312") {
            document.getElementById('login-gate').style.display = "none";
            syncFiles();
        } else {
            alert("FATAL ERROR: INVALID ACCESS CODE");
        }
    }

    // Matrix Background Animation Logic
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, columns, drops = [];

    function initMatrixSystem() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / 18);
        drops = Array(columns).fill(1);
    }

    function runMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00ff9f";
        ctx.font = "18px monospace";
        for(let i = 0; i < drops.length; i++) {
            const text = Math.random() > 0.5 ? "0" : "1";
            ctx.fillText(text, i * 18, drops[i] * 18);
            if(drops[i] * 18 > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    window.onresize = initMatrixSystem;
    initMatrixSystem();
    setInterval(runMatrix, 55);

    // Background Image Rotation Logic
    let bgImages = document.querySelectorAll('.hacker-img');
    let currentBgIdx = 0;
    function rotateBackground() {
        bgImages.forEach(img => img.classList.remove('active'));
        bgImages[currentBgIdx].classList.add('active');
        currentBgIdx = (currentBgIdx + 1) % bgImages.length;
    }
    setInterval(rotateBackground, 6000);
    rotateBackground();

    // Clock System
    setInterval(() => {
        const now = new Date();
        document.getElementById('os-clock').innerText = now.toLocaleTimeString('en-GB');
    }, 1000);

    // =========================================
    // DATABASE & MEDIA ENGINE (FIREBASE)
    // =========================================
    const amosConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(amosConfig);
    const database = firebase.firestore();
    const audioPlayer = document.getElementById("coreAudioEngine");

    let playlist = [], activeIdx = 0, isShuffle = false, isRepeat = false;

    function toggleShuffleMode() { 
        isShuffle = !isShuffle; 
        document.getElementById('shuf-icon').classList.toggle('active'); 
    }
    
    function toggleRepeatMode() { 
        isRepeat = !isRepeat; 
        document.getElementById('rep-icon').classList.toggle('active'); 
    }

    function initSoundCloudStream() {
        const trackId = document.getElementById('soundcloud-id-input').value;
        const frame = document.getElementById('sc-frame');
        if(!trackId) return;
        frame.src = `https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/${trackId}&color=%23ff5500&auto_play=true`;
        frame.style.display = "block";
        audioPlayer.pause();
    }

    function syncFiles() {
        database.collection("files").orderBy("created", "desc").onSnapshot(snapshot => {
            playlist = [];
            const listContainer = document.getElementById("local-list");
            const gridContainer = document.getElementById("storage-grid");
            listContainer.innerHTML = ""; 
            gridContainer.innerHTML = "";
            
            snapshot.forEach(doc => {
                const fileData = doc.data();
                if(fileData.type === 'audio') {
                    playlist.push({id: doc.id, ...fileData});
                    listContainer.innerHTML += `
                        <div class="nav-link" onclick="playSelected('${doc.id}')" style="background:rgba(255,255,255,0.03)">
                            <i class="fa-solid fa-play"></i> <span>${fileData.name}</span>
                        </div>`;
                }
                gridContainer.innerHTML += `
                    <div style="background:#111; padding:15px; border-radius:15px; text-align:center; border:1px solid #222">
                        <i class="fa-solid fa-file-audio" style="font-size:30px"></i><br>
                        <small style="font-size:9px">${fileData.name.substring(0,10)}...</small>
                    </div>`;
            });
        });
    }

    function playSelected(id) {
        activeIdx = playlist.findIndex(item => item.id === id);
        executePlay();
    }

    function executePlay() {
        const track = playlist[activeIdx];
        audioPlayer.src = track.url;
        audioPlayer.play();
        document.getElementById("display-name").innerText = track.name;
        document.getElementById("main-play-btn").className = "fa-solid fa-circle-pause";
        document.getElementById('sc-frame').style.display = "none";
    }

    function handleToggle() {
        if(audioPlayer.paused) {
            audioPlayer.play();
            document.getElementById("main-play-btn").className = "fa-solid fa-circle-pause";
        } else {
            audioPlayer.pause();
            document.getElementById("main-play-btn").className = "fa-solid fa-circle-play";
        }
    }

    function changeTrack(direction) {
        if(playlist.length === 0) return;
        if(isRepeat && direction === 1) { /* Just replay current */ }
        else if(isShuffle && direction === 1) { activeIdx = Math.floor(Math.random() * playlist.length); }
        else { activeIdx = (activeIdx + direction + playlist.length) % playlist.length; }
        executePlay();
    }

    audioPlayer.onended = () => { if(isRepeat) executePlay(); else changeTrack(1); };
    
    audioPlayer.ontimeupdate = () => {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        document.getElementById("prog-fill").style.width = progress + "%";
    };

    function handleSeek(event) {
        const rect = event.currentTarget.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        audioPlayer.currentTime = (offsetX / rect.width) * audioPlayer.duration;
    }

    async function processUpload() {
        const file = document.getElementById("uploadInput").files[0];
        if(!file) return;
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "ml_default");
        
        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: formData });
            const result = await response.json();
            await database.collection("files").add({
                name: file.name,
                url: result.secure_url,
                type: "audio",
                created: Date.now()
            });
            alert("FILE SECURED ON CLOUD");
        } catch(err) {
            alert("UPLOAD INTERRUPTED");
        }
    }
</script>
</body>
</html>
