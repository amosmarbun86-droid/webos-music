            text-align: center; border: 1px solid rgba(0,255,159,0.1);

        .file-name { font-size: 10px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

        .controls { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .c-btn { font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .c-btn.active { opacity: 1; color: #fff; text-shadow: var(--glow-shadow); }

        #floating-player { 
            position:fixed; bottom:110px; right:25px; width:68px; height:68px; 
            background:rgba(0,0,0,0.9); border:2px solid var(--matrix-color); 
            border-radius:50%; display:none; justify-content:center; align-items:center; 
            z-index:2500; cursor:move; box-shadow: var(--glow-shadow);
        }
        #floating-player i { font-size:30px; animation: disc-spin 4s linear infinite; }
        @keyframes disc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #login-gate { position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center; }
        .login-box { text-align:center; width:85%; max-width:330px; padding:40px; border:1px solid var(--matrix-color); border-radius:25px; box-shadow: var(--glow-shadow); }

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function openWindow(id) {
        document.getElementById(id).style.display = "flex";
        toggleSidebar();
        document.getElementById('floating-player').style.display = "none";
    }

    function closeWindow(id) {
        document.getElementById(id).style.display = "none";
        if(!audio.paused) document.getElementById('floating-player').style.display = "flex";
    }

    function checkAuth() {
        if(document.getElementById('sys-pin').value === "101312") {
            document.getElementById('login-gate').style.display = "none";
            syncData();
        } else { alert("ACCESS DENIED!"); }
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, cols, drops = [];
    function initM() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; cols = Math.floor(w/18); drops = Array(cols).fill(1); }
    function runM() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#00ff9f"; ctx.font = "18px monospace";
        drops.forEach((y, i) => {
            const txt = Math.floor(Math.random()*2); ctx.fillText(txt, i*18, y*18);
            if(y*18 > h && Math.random() > 0.975) drops[i] = 0; drops[i]++;
        });
    }
    window.onresize = initM; initM(); setInterval(runM, 55);
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000);

    let bgImgs = document.querySelectorAll('.hacker-img'), bgIdx = 0;
    setInterval(() => { 
        bgImgs.forEach(img => img.classList.remove('active'));
        bgImgs[bgIdx].classList.add('active'); bgIdx = (bgIdx+1)%bgImgs.length;
    }, 6000);

    const config = { 
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0", 
        authDomain: "amos-web-os.firebaseapp.com", 
        projectId: "amos-web-os", 
        storageBucket: "amos-web-os.firebasestorage.app", 
        messagingSenderId: "59843745100", 
        appId: "1:59843745100:web:b29e5996052a3bf5672be9" 
    };
    firebase.initializeApp(config);
    const db = firebase.firestore();
    const audio = document.getElementById("audioCore");

    let playlist = [], currentIdx = 0, isShuf = false, isRep = false;

    function toggleShuffle() { isShuf = !isShuf; document.getElementById('shuf-icon').classList.toggle('active'); }
    function toggleRepeat() { isRep = !isRep; document.getElementById('rep-icon').classList.toggle('active'); }

    function syncData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            playlist = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("main-file-grid");
            if(mList) mList.innerHTML = ""; 
            if(fGrid) fGrid.innerHTML = "";

            snap.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                
                if(data.type === 'audio') {
                    playlist.push({id, ...data});
                    if(mList) mList.innerHTML += `
                        <div class="nav-link" onclick="playMusic('${id}')" style="background:rgba(255,255,255,0.03); justify-content:space-between">
                            <span><i class="fa-solid fa-play"></i> ${data.name}</span>
                            <i class="fa-solid fa-trash-can" style="color:#ff4d4d; padding:10px;" onclick="event.stopPropagation(); deleteFile('${id}')"></i>
                        </div>`;
                }

                let icon = "fa-file-code", color = "var(--matrix-color)";
                if(data.type === 'image') { icon = "fa-file-image"; color = "#00d4ff"; }
                else if(data.type === 'audio') { icon = "fa-file-audio"; color = "#ffcc00"; }
                
                if(fGrid) fGrid.innerHTML += `
                    <div class="file-item" onclick="window.open('${data.url}')">
                        <i class="fa-solid ${icon}" style="color:${color}"></i>
                        <span class="file-name">${data.name}</span>
                        <i class="fa-solid fa-circle-xmark" style="position:absolute; top:5px; right:5px; color:red; font-size:14px;" onclick="event.stopPropagation(); deleteFile('${id}')"></i>
                    </div>`;
            });
        });
    }

    function playMusic(id) { currentIdx = playlist.findIndex(s => s.id === id); startEngine(); }
    function startEngine() {
        const track = playlist[currentIdx];
        if(!track) return;
        audio.src = track.url; audio.play();
        document.getElementById("track-name").innerText = track.name;
        document.getElementById("play-btn").className = "fa-solid fa-circle-pause";
        document.getElementById('sc-frame').style.display = "none";
        document.getElementById('floating-player').style.display = "flex";
    }

    function togglePlayback() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-circle-pause"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-circle-play"; }
    }

    function skipTrack(dir) {
        if(playlist.length === 0) return;
        if(isRep && dir === 1) {} 
        else if(isShuf && dir === 1) { currentIdx = Math.floor(Math.random()*playlist.length); }
        else { currentIdx = (currentIdx + dir + playlist.length) % playlist.length; }
        startEngine();
    }

    function loadSC() {
        const id = document.getElementById('sc-id').value;
        const frame = document.getElementById('sc-frame');
        if(!id) return;
        frame.src = `https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/${id}&color=%23ff5500&auto_play=true`;
        frame.style.display = "block"; audio.pause();
    }

    async function deleteFile(id) {
        if(confirm("Hapus file ini secara permanen?")) {
            await db.collection("files").doc(id).delete();
        }
    }

    async function uploadToCloud(mode) {
        const fileInput = mode === 'audio' ? document.getElementById("mUp") : document.getElementById("fAny");
        const file = fileInput.files[0];
        if(!file) return;
        const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: fd });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "other";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
            alert("UPLOAD BERHASIL");
        } catch(e) { alert("UPLOAD GAGAL"); }
    }

    audio.onended = () => { if(isRep) startEngine(); else skipTrack(1); };
    audio.ontimeupdate = () => { if(audio.duration) document.getElementById("prog-fill").style.width = (audio.currentTime/audio.duration)*100 + "%"; };
    function handleSeek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }

    const float = document.getElementById('floating-player');
    let isDrag = false, xOff = 0, yOff = 0;
    float.onmousedown = (e) => { isDrag = true; xOff = e.clientX - float.offsetLeft; yOff = e.clientY - float.offsetTop; };
    document.onmousemove = (e) => { 
        if(isDrag) { 
            float.style.left = (e.clientX - xOff) + "px"; 
            float.style.top = (e.clientY - yOff) + "px"; 
            float.style.right = "auto"; float.style.bottom = "auto"; 
        } 
    };
    document.onmouseup = () => isDrag = false;
</script>
</body>
</html>
