<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS WEB OS V14 PRO - MATRIX EDITION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --matrix-color: #00ff9f; }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color: var(--matrix-color); overflow:hidden; touch-action: manipulation; }
        
        /* MATRIX CANVAS BACKGROUND */
        #bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; transition: filter 1s ease; }
        
        button { cursor:pointer; background:rgba(0,0,0,0.8); color: var(--matrix-color); border:1px solid var(--matrix-color); padding:10px 15px; border-radius:8px; transition: 0.3s; font-size: 14px; font-weight: bold; }
        button:hover { background: var(--matrix-color); color:black; box-shadow: 0 0 15px var(--matrix-color); }
        input { background:rgba(0,0,0,0.7); color: var(--matrix-color); border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 10px; font-size: 16px; }

        /* WINDOWS SYSTEM */
        .window { position:fixed; top:10%; left:5%; width:90%; height:80%; background:rgba(0,5,5,0.92); border:1px solid rgba(0,255,159,0.3); display:none; flex-direction:column; z-index:100; border-radius: 15px; overflow: hidden; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0,0,0,1); }
        .titlebar { background:rgba(0,255,159,0.15); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,255,159,0.2); font-weight:bold; letter-spacing: 1px; }
        .window-content { flex:1; padding:15px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* PLAYER UI */
        .player-card { background: rgba(0,255,159,0.05); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(0,255,159,0.1); }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; font-size: 28px; }
        .controls i { cursor: pointer; transition: 0.2s; color: var(--matrix-color); }
        .play-btn { font-size: 50px !important; }
        .progress-bar { width: 100%; height: 6px; background: #111; border-radius: 10px; cursor: pointer; margin: 10px 0; overflow: hidden; }
        #prog-fill { width: 0%; height: 100%; background: var(--matrix-color); box-shadow: 0 0 10px var(--matrix-color); }
        .active-icon { color: #fff !important; text-shadow: 0 0 15px var(--matrix-color); }

        /* FILE GRID */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .file-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; text-align: center; position: relative; border: 1px solid transparent; }
        .file-item i { font-size: 40px; margin-bottom: 8px; display: block; }
        .file-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; color: #ccc; }
        .del-file { position: absolute; top: 5px; right: 5px; color: #ff4d4d; font-size: 14px; }

        /* INTERFACE */
        #header { position: fixed; top: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.9); border-bottom: 1px solid rgba(0,255,159,0.2); display: flex; align-items: center; padding: 0 15px; z-index: 1000; justify-content: space-between; box-sizing: border-box; }
        #sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100vh; background: #000; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 25px; box-sizing: border-box; border-right: 1px solid var(--matrix-color); }
        #sidebar.active { left: 0; }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .nav-link:active { background: rgba(0,255,159,0.2); }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 40px; border: 1px solid var(--matrix-color); border-radius: 20px; width: 85%; max-width: 320px; background: rgba(0,0,0,0.8); box-shadow: 0 0 20px var(--matrix-color); }

        @media (min-width: 768px) {
            .window { width: 750px; height: 600px; top: 60px; left: 280px; }
            #sidebar { left: 0; }
            #header { display: none; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-terminal" style="font-size: 50px; color: var(--matrix-color); margin-bottom: 25px;"></i>
        <h2 style="letter-spacing: 5px; font-size: 18px; margin-bottom: 30px;">SYSTEM ACCESS</h2>
        <input type="password" id="sys-pin" placeholder="Enter PIN">
        <button onclick="unlock()" style="width: 100%;">BOOT SYSTEM</button>
    </div>
</div>

<div id="header">
    <i class="fa-solid fa-bars-staggered" onclick="document.getElementById('sidebar').classList.toggle('active')"></i>
    <span style="font-weight: bold; letter-spacing: 3px; color: var(--matrix-color);">AMOS_OS V14</span>
    <i class="fa-solid fa-microchip"></i>
</div>

<div id="sidebar">
    <div style="margin-bottom: 40px; border-bottom: 1px solid rgba(0,255,159,0.3); padding-bottom: 15px;">
        <h1 style="font-size: 20px; margin:0;">AMOS<span style="color:#fff;">_V14</span></h1>
        <small style="color: var(--matrix-color); font-size: 10px;">PREMIUM MATRIX OS</small>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-music"></i> Cloud Music</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-database"></i> File Manager</div>
    <div class="nav-link" onclick="location.reload()" style="margin-top: 50px; color: #ff4d4d;"><i class="fa-solid fa-power-off"></i> Shutdown</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>MUSIC PLAYER PRO</span> <span onclick="closeWin('musicWin')">✕</span></div>
        <div class="window-content">
            <div style="background: rgba(0,255,159,0.08); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <input type="file" id="mFile" style="display:none" onchange="uploadTrack('file')">
                <div style="display: flex; gap: 8px;">
                    <button onclick="document.getElementById('mFile').click()" style="flex:1"><i class="fa-solid fa-upload"></i> FILE</button>
                    <button onclick="addByLink()" style="flex:1"><i class="fa-solid fa-link"></i> LINK</button>
                </div>
            </div>

            <div class="player-card">
                <h3 id="track-name" style="margin: 0; font-size: 16px; color: #fff;">Sistem Ready...</h3>
                <div class="progress-bar" onclick="seek(event)"><div id="prog-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 10px;">
                    <span id="cur-t">0:00</span><span id="dur-t">0:00</span>
                </div>
                <div class="controls">
                    <i class="fa-solid fa-shuffle" id="shuf-btn" onclick="toggleShuffle()"></i>
                    <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)"></i>
                    <i class="fa-solid fa-play-circle play-btn" id="play-btn" onclick="togglePlay()"></i>
                    <i class="fa-solid fa-forward-step" onclick="changeTrack(1)"></i>
                    <i class="fa-solid fa-repeat" id="rep-btn" onclick="toggleRepeat()"></i>
                </div>
            </div>

            <h4 style="margin-top: 25px; border-left: 3px solid var(--matrix-color); padding-left: 10px;">PLAYLIST</h4>
            <div id="music-list"></div>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>STORAGE MANAGER</span> <span onclick="closeWin('fileWin')">✕</span></div>
        <div class="window-content">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="file" id="fAny" style="display:none" onchange="uploadTrack('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:1">UPLOAD NEW</button>
                <button onclick="loadData()" style="flex:1">REFRESH</button>
            </div>
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // MATRIX ANIMATION ENGINE
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, columns;
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
    const fontSize = 16;
    let drops = [];
    let matrixColor = "#00ff9f";

    function initMatrix() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = matrixColor;
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    // Change Matrix Color every 5 seconds
    const colors = ["#00ff9f", "#00d1ff", "#ff003c", "#f3ff00", "#ffffff", "#00ff00"];
    let colorIdx = 0;
    setInterval(() => {
        colorIdx = (colorIdx + 1) % colors.length;
        matrixColor = colors[colorIdx];
        document.documentElement.style.setProperty('--matrix-color', matrixColor);
    }, 5000);

    window.addEventListener('resize', initMatrix);
    initMatrix();
    setInterval(drawMatrix, 35);

    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audio");

    let songs = [];
    let curIdx = 0;
    let isShuffle = false;
    let isRepeat = false;

    function unlock() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            loadData();
        } else { alert("ACCESS DENIED!"); }
    }

    function openWin(id) { 
        document.getElementById(id).style.display = "flex"; 
        if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
    }
    function closeWin(id) { document.getElementById(id).style.display = "none"; }

    function loadData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("file-grid");
            mList.innerHTML = ""; fGrid.innerHTML = "";

            snap.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                if(d.type === 'audio') {
                    songs.push({id, ...d});
                    mList.innerHTML += `
                        <div class="nav-link" onclick="playSong('${id}')" style="background:rgba(255,255,255,0.02); justify-content:space-between">
                            <span><i class="fa-solid fa-play"></i> ${d.name}</span>
                            <i class="fa-solid fa-trash-can" style="color:#ff4d4d" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                        </div>`;
                }
                let icon = d.type === 'image' ? 'fa-file-image' : d.type === 'audio' ? 'fa-file-audio' : 'fa-file-pdf';
                fGrid.innerHTML += `
                    <div class="file-item" onclick="window.open('${d.url}')">
                        <i class="fa-solid ${icon}" style="color:var(--matrix-color)"></i>
                        <span class="file-name">${d.name}</span>
                        <i class="fa-solid fa-xmark del-file" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                    </div>`;
            });
        });
    }

    function playSong(id) { curIdx = songs.findIndex(s => s.id === id); start(); }
    function start() {
        const s = songs[curIdx];
        audio.src = s.url; audio.play();
        document.getElementById("track-name").innerText = s.name;
        document.getElementById("play-btn").className = "fa-solid fa-pause-circle play-btn";
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-pause-circle play-btn"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-play-circle play-btn"; }
    }

    function changeTrack(dir) {
        if(isShuffle && dir > 0) curIdx = Math.floor(Math.random() * songs.length);
        else curIdx = (curIdx + dir + songs.length) % songs.length;
        start();
    }

    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById("shuf-btn").classList.toggle("active-icon", isShuffle); }
    function toggleRepeat() { isRepeat = !isRepeat; audio.loop = isRepeat; document.getElementById("rep-btn").classList.toggle("active-icon", isRepeat); }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
        document.getElementById("cur-t").innerText = fmt(audio.currentTime);
        document.getElementById("dur-t").innerText = fmt(audio.duration);
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }
    audio.onended = () => { if(!isRepeat) changeTrack(1); };

    async function uploadTrack(mode) {
        const file = mode === 'file' ? document.getElementById("mFile").files[0] : document.getElementById("fAny").files[0];
        if(!file) return;
        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "pdf";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
        } catch(e) { alert("Upload Failed!"); }
    }

    async function addByLink() {
        const url = prompt("Direct URL MP3:");
        const name = prompt("Track Name:");
        if(url && name) await db.collection("files").add({ name: name, url: url, type: "audio", created: Date.now() });
    }

    async function deleteF(id) { if(confirm("Hapus?")) await db.collection("files").doc(id).delete(); }
</script>
</body>
</html>
