<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - LUXURY PREMIUM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --matrix-color: #00ff9f; --premium-glow: rgba(0, 255, 159, 0.5); }
        body { margin:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: var(--matrix-color); overflow:hidden; touch-action: manipulation; }
        
        /* LUXURY BACKGROUND SYSTEM */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; background: #000; }
        .hacker-img { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0; transition: opacity 2s ease-in-out, transform 10s linear; transform: scale(1.2); }
        .hacker-img.active { opacity:0.4; transform: scale(1.0); }
        
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.2; pointer-events:none; }
        
        /* PREMIUM GLASSMORPHISM WINDOW */
        .window { 
            position:fixed; top:10%; left:5%; width:90%; height:78%; 
            background: rgba(0, 10, 10, 0.85); 
            border: 1px solid rgba(0, 255, 159, 0.2); 
            display:none; flex-direction:column; z-index:100; 
            border-radius: 20px; overflow: hidden; 
            backdrop-filter: blur(25px); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 15px rgba(0, 255, 159, 0.05);
            animation: winSpawn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes winSpawn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }

        .titlebar { background: rgba(0, 255, 159, 0.08); padding: 18px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(0, 255, 159, 0.1); font-weight: bold; letter-spacing: 1px; }
        .window-content { flex:1; padding:20px; overflow-y:auto; scrollbar-width: none; }
        .window-content::-webkit-scrollbar { display: none; }

        /* BUTTONS & INPUTS */
        button { 
            cursor:pointer; background: transparent; color: var(--matrix-color); 
            border: 1px solid var(--matrix-color); padding: 12px 20px; border-radius: 12px; 
            transition: 0.3s; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: var(--matrix-color); color: #000; box-shadow: 0 0 20px var(--premium-glow); }
        
        input { 
            background: rgba(0,0,0,0.6); color: var(--matrix-color); border: 1px solid rgba(0, 255, 159, 0.2); 
            padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 15px;
        }

        /* FLOATING MUSIC LUXURY */
        #floating-player { 
            position:fixed; bottom:110px; right:20px; width:65px; height:65px; 
            background: rgba(0,0,0,0.9); border: 2px solid var(--matrix-color); 
            border-radius: 50%; display:none; flex-direction:column; justify-content:center; 
            align-items:center; z-index:2000; cursor:pointer; 
            box-shadow: 0 0 20px var(--premium-glow); transition: 0.3s;
        }
        #floating-player:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--matrix-color); }
        #floating-player i { font-size: 26px; color: var(--matrix-color); animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* PREMIUM SIDEBAR */
        #sidebar { 
            position: fixed; left: -280px; top: 0; width: 270px; height: 100vh; 
            background: rgba(0,0,0,0.95); z-index: 3000; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 30px; box-sizing: border-box; border-right: 1px solid rgba(0, 255, 159, 0.2); 
        }
        #sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.9); }
        .nav-link { 
            padding: 18px; display: flex; align-items: center; gap: 15px; border-radius: 15px; 
            cursor: pointer; margin-bottom: 12px; transition: 0.3s; border: 1px solid transparent;
        }
        .nav-link:hover { background: rgba(0, 255, 159, 0.05); border-color: rgba(0, 255, 159, 0.2); color: #fff; }

        /* FILE MANAGER GRID */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        .file-item { 
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 18px; 
            text-align: center; position: relative; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05);
        }
        .file-item:hover { transform: translateY(-5px); background: rgba(0, 255, 159, 0.05); border-color: var(--matrix-color); }
        .file-item i { font-size: 40px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?q=80&w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box" style="text-align: center; border: 1px solid var(--matrix-color); padding: 50px; border-radius: 30px; background: rgba(0,0,0,0.9); box-shadow: 0 0 50px rgba(0,0,0,1);">
        <i class="fa-solid fa-user-secret" style="font-size: 70px; margin-bottom: 20px; text-shadow: 0 0 20px var(--matrix-color);"></i>
        <h2 style="letter-spacing: 8px; font-size: 14px; margin-bottom: 30px;">SECURE LOGON</h2>
        <input type="password" id="sys-pin" placeholder="••••••" style="text-align: center; font-size: 24px; letter-spacing: 5px;">
        <button onclick="unlock()" style="width: 100%;">Initialize Boot</button>
    </div>
</div>

<div id="header" style="position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(0,255,159,0.2); display: flex; align-items: center; padding: 0 20px; z-index: 1000; justify-content: space-between; backdrop-filter: blur(10px);">
    <i class="fa-solid fa-bars-staggered" onclick="document.getElementById('sidebar').classList.toggle('active')" style="font-size: 20px; cursor: pointer;"></i>
    <span style="font-weight: bold; letter-spacing: 4px; font-size: 18px;">AMOS<span style="color:#fff;">_V14</span></span>
    <div id="digitalClock" style="font-family: monospace; font-size: 14px; color: #fff;">00:00</div>
</div>

<div id="sidebar">
    <div style="margin-bottom: 50px; border-bottom: 1px solid rgba(0,255,159,0.2); padding-bottom: 20px;">
        <h3 style="margin:0; letter-spacing: 2px;">PREMIUM <span style="color:var(--matrix-color);">USER</span></h3>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-compact-disc"></i> Media Player</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-folder-tree"></i> File System</div>
    <div class="nav-link" onclick="location.reload()" style="margin-top: 100px; color: #ff4d4d; border-color: rgba(255,77,77,0.2);"><i class="fa-solid fa-power-off"></i> Terminate</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span><i class="fa-solid fa-play"></i> STREAMING CENTER</span> <span onclick="closeWin('musicWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--matrix-color); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--premium-glow);">
                    <i class="fa-solid fa-music" style="font-size: 50px;"></i>
                </div>
                <h3 id="track-name" style="margin: 0; color: #fff; letter-spacing: 1px;">Ready to Play</h3>
            </div>
            
            <div style="background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="width: 100%; height: 6px; background: #111; border-radius: 10px; cursor: pointer; position: relative;" onclick="seek(event)">
                    <div id="prog-fill" style="width: 0%; height: 100%; background: var(--matrix-color); border-radius: 10px; box-shadow: 0 0 10px var(--matrix-color);"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 10px;">
                    <span id="cur-t">0:00</span><span id="dur-t">0:00</span>
                </div>
                <div style="display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 20px;">
                    <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)" style="font-size: 24px; cursor: pointer;"></i>
                    <i class="fa-solid fa-circle-play" id="play-btn" onclick="togglePlay()" style="font-size: 60px; color: var(--matrix-color); cursor: pointer;"></i>
                    <i class="fa-solid fa-forward-step" onclick="changeTrack(1)" style="font-size: 24px; cursor: pointer;"></i>
                </div>
            </div>
            <div id="music-list" style="margin-top: 25px;"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <input type="file" id="mFile" style="display:none" onchange="uploadTrack('file')">
                <button onclick="document.getElementById('mFile').click()" style="flex:1">Upload MP3</button>
                <button onclick="addByLink()" style="flex:1">URL Link</button>
            </div>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span><i class="fa-solid fa-database"></i> CLOUD STORAGE</span> <span onclick="closeWin('fileWin')" style="cursor:pointer">✕</span></div>
        <div class="window-content">
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <input type="file" id="fAny" style="display:none" onchange="uploadTrack('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:2">Add New Object</button>
                <button onclick="loadData()" style="flex:1">Sync</button>
            </div>
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>
</div>

<div id="floating-player" onclick="togglePlay()">
    <i class="fa-solid fa-compact-disc"></i>
</div>

<audio id="audioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // MATRIX & BG ENGINE
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, columns;
    const chars = "01011010101ANONYMOUS_AMOS_V14_PREMIUM";
    const fontSize = 18;
    let drops = [];

    function initMatrix() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00ff9f";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    const hackerImgs = document.querySelectorAll('.hacker-img');
    let imgIdx = 0;
    function changeHackerBg() {
        hackerImgs.forEach(img => img.classList.remove('active'));
        hackerImgs[imgIdx].classList.add('active');
        imgIdx = (imgIdx + 1) % hackerImgs.length;
    }

    window.addEventListener('resize', initMatrix);
    initMatrix();
    setInterval(drawMatrix, 50);
    setInterval(changeHackerBg, 5000);
    changeHackerBg();

    // FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audioEngine");

    let songs = [];
    let curIdx = 0;

    function unlock() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            loadData();
        } else { alert("ACCESS DENIED"); }
    }

    function openWin(id) { 
        document.getElementById(id).style.display = "flex"; 
        if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
        document.getElementById('floating-player').style.display = "none";
    }
    function closeWin(id) { 
        document.getElementById(id).style.display = "none"; 
        if(!audio.paused) document.getElementById('floating-player').style.display = "flex";
    }

    function loadData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("file-grid");
            mList.innerHTML = ""; fGrid.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                if(d.type === 'audio') {
                    songs.push({id: doc.id, ...d});
                    mList.innerHTML += `<div class="nav-link" onclick="playSong('${doc.id}')" style="justify-content:space-between; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05)"><span><i class="fa-solid fa-play"></i> ${d.name}</span><i class="fa-solid fa-trash" style="color:#ff4d4d" onclick="event.stopPropagation(); deleteF('${doc.id}')"></i></div>`;
                }
                let icon = d.type === 'image' ? 'fa-file-image' : d.type === 'audio' ? 'fa-file-audio' : 'fa-file-pdf';
                fGrid.innerHTML += `<div class="file-item" onclick="window.open('${d.url}')"><i class="fa-solid ${icon}" style="color:var(--matrix-color)"></i><span class="file-name">${d.name}</span><i class="fa-solid fa-circle-xmark" style="position:absolute; top:8px; right:8px; color:#ff4d4d; cursor:pointer" onclick="event.stopPropagation(); deleteF('${doc.id}')"></i></div>`;
            });
        });
    }

    function playSong(id) { curIdx = songs.findIndex(s => s.id === id); start(); }
    function start() {
        const s = songs[curIdx];
        audio.src = s.url; audio.play();
        document.getElementById("track-name").innerText = s.name;
        document.getElementById("play-btn").className = "fa-solid fa-circle-pause";
        document.getElementById('floating-player').style.display = (document.getElementById('musicWin').style.display === "flex") ? "none" : "flex";
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-circle-pause"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-circle-play"; }
    }

    function changeTrack(dir) {
        if(songs.length === 0) return;
        curIdx = (curIdx + dir + songs.length) % songs.length;
        start();
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
        document.getElementById("cur-t").innerText = fmt(audio.currentTime);
        document.getElementById("dur-t").innerText = fmt(audio.duration);
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }
    audio.onended = () => changeTrack(1);

    async function uploadTrack(mode) {
        const file = mode === 'file' ? document.getElementById("mFile").files[0] : document.getElementById("fAny").files[0];
        if(!file) return;
        const form = new FormData();
        form.append("file", file); form.append("upload_preset", "ml_default");
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "pdf";
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
        } catch(e) { alert("Upload Failed"); }
    }

    async function addByLink() {
        const url = prompt("Direct MP3 Link:");
        const name = prompt("Track Name:");
        if(url && name) await db.collection("files").add({ name: name, url: url, type: "audio", created: Date.now() });
    }

    async function deleteF(id) { if(confirm("Hapus Permanen?")) await db.collection("files").doc(id).delete(); }

    setInterval(() => { 
        const now = new Date();
        document.getElementById("digitalClock").innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }, 1000);
</script>
</body>
</html>
