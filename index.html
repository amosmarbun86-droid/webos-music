<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS WEB OS V14 PRO - CLOUD MUSIC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* BASE SYSTEM THEME */
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color:#00ff9f; overflow:hidden; touch-action: manipulation; }
        #bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.1; pointer-events:none; }
        
        button { cursor:pointer; background:rgba(0,0,0,0.8); color:#00ff9f; border:1px solid #00ff9f; padding:10px 16px; border-radius:8px; transition: 0.3s; font-weight: bold; font-size: 14px; }
        input { background:#0a0a0a; color:#00ff9f; border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; font-size: 16px; }

        /* SIDEBAR (Responsive) */
        #sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100vh; background: #030303; border-right: 1px solid #00ff9f33; padding: 25px; z-index: 2000; transition: 0.3s; box-sizing: border-box; }
        #sidebar.active { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1500; }
        .overlay.active { display: block; }

        .menu-link { padding: 15px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; font-size: 15px; }
        .menu-link:hover { background: rgba(0,255,159,0.15); color: #fff; }

        /* WINDOW MANAGEMENT */
        .window { position:fixed; top:10%; left:5%; width:90%; height:80%; background:rgba(0,10,15,0.98); border:1px solid #00ff9f44; display:none; flex-direction:column; z-index:100; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border-radius: 20px; overflow: hidden; backdrop-filter: blur(20px); }
        .titlebar { background:rgba(0,255,159,0.1); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #00ff9f22; font-weight:bold; }
        .window-content { flex:1; padding:20px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* CLOUD SEARCH UI */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .sc-frame { width: 100%; height: 166px; border: none; border-radius: 12px; margin-top: 15px; display: none; }
        
        /* MUSIC LIST STYLE */
        .playlist-item { background: rgba(0,255,159,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00ff9f11; }
        .playlist-item:active { background: rgba(0,255,159,0.2); }

        /* TASKBAR & HEADER */
        #mobile-header { position: fixed; top: 0; width: 100%; height: 55px; background: #000; border-bottom: 1px solid #00ff9f33; display: flex; align-items: center; padding: 0 15px; z-index: 1000; box-sizing: border-box; justify-content: space-between; }
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 45px; background: #000; border-top: 1px solid #00ff9f22; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 1000; box-sizing: border-box; font-size: 12px; }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 30px; width: 85%; max-width: 320px; border: 1px solid #00ff9f44; border-radius: 20px; background: #050505; }

        @media (min-width: 768px) {
            #sidebar { left: 0; }
            #mobile-header { display: none; }
            .window { width: 700px; height: 600px; top: 60px; left: 280px; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-signal" style="font-size: 40px; color: #00ff9f; margin-bottom: 20px;"></i>
        <h2 style="letter-spacing: 4px; font-size: 18px;">AMOS CLOUD OS</h2>
        <input type="password" id="sys-pin" placeholder="PIN: 101312" style="margin-bottom: 20px; text-align: center;">
        <button onclick="unlockSystem()" style="width: 100%;">ACCESS SYSTEM</button>
    </div>
</div>

<div id="mobile-header">
    <i class="fa-solid fa-bars-staggered" style="font-size: 20px;" onclick="toggleSidebar()"></i>
    <span style="font-weight: bold; letter-spacing: 2px; color: #00ff9f;">AMOS_V14</span>
    <i class="fa-solid fa-cloud-moon"></i>
</div>

<div id="sidebar">
    <div style="margin-bottom: 30px; border-bottom: 1px solid #00ff9f22; padding-bottom: 15px;">
        <h1 style="font-size: 18px; color: #fff;">AMOS<span style="color:#00ff9f;">_V14</span></h1>
    </div>
    <div class="menu-link" onclick="toggleApp('musicApp'); toggleSidebar();"><i class="fa-solid fa-cloud-bolt"></i> Cloud Music</div>
    <div class="menu-link" onclick="toggleApp('fileApp'); toggleSidebar();"><i class="fa-solid fa-hard-drive"></i> Storage</div>
    <div class="menu-link" onclick="location.reload()" style="margin-top: 40px; color: #ff4d4d;"><i class="fa-solid fa-power-off"></i> Logout</div>
</div>

<div id="workspace">
    <div class="window" id="musicApp">
        <div class="titlebar"><span>CLOUD MUSIC SEARCH</span> <span onclick="toggleApp('musicApp')">✕</span></div>
        <div class="window-content">
            <p style="font-size: 12px; opacity: 0.6;">Cari lagu online (SoundCloud) atau putar dari storage.</p>
            
            <div class="search-box">
                <input type="text" id="musicQuery" placeholder="Cari Judul / Artis...">
                <button onclick="searchCloudMusic()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <iframe id="sc-player" class="sc-frame" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>

            <div style="margin-top: 25px;">
                <h3 style="font-size: 14px; color: #00ff9f; border-left: 3px solid #00ff9f; padding-left: 10px;">STORAGE PLAYLIST</h3>
                <div id="playlist-view"></div>
            </div>
        </div>
    </div>

    <div class="window" id="fileApp">
        <div class="titlebar"><span>LOCAL STORAGE</span> <span onclick="toggleApp('fileApp')">✕</span></div>
        <div class="window-content">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="fetchData()" style="flex:1;"><i class="fa-solid fa-sync"></i> REFRESH</button>
            </div>
            <div id="file-grid-view"></div>
        </div>
    </div>
</div>

<div id="taskbar">
    <div><i class="fa-solid fa-circle-check"></i> Connected</div>
    <div id="sys-clock">00:00:00</div>
</div>

<audio id="audioEngine"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audioEngine");

    // SYSTEM FUNCTIONS
    function unlockSystem() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            fetchData();
        } else { alert("ACCESS DENIED"); }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function toggleApp(id) {
        const a = document.getElementById(id);
        const isOpen = a.style.display === "flex";
        document.querySelectorAll('.window').forEach(w => w.style.display = "none");
        a.style.display = isOpen ? "none" : "flex";
    }

    // CLOUD MUSIC SEARCH (SOUNDCLOUD API REDIRECT)
    function searchCloudMusic() {
        const q = document.getElementById("musicQuery").value;
        if(!q) return;
        
        // Menggunakan SoundCloud Widget API untuk mencari lagu secara dinamis
        // Kami membuat URL pencarian yang akan dimuat oleh widget
        const scWidget = document.getElementById("sc-player");
        const encodedQuery = encodeURIComponent(q);
        
        // Mengarahkan ke SoundCloud Search via Widget
        scWidget.src = `https://w.soundcloud.com/player/?url=https://soundcloud.com/search/sounds?q=${encodedQuery}&color=%2300ff9f&auto_play=true&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true`;
        scWidget.style.display = "block";
    }

    // DATA FETCH FROM FIREBASE
    async function fetchData() {
        const snap = await db.collection("files").orderBy("created", "desc").get();
        const list = document.getElementById("playlist-view");
        list.innerHTML = "";

        snap.forEach(doc => {
            const data = doc.data();
            if(data.type === 'audio') {
                list.innerHTML += `
                    <div class="playlist-item" onclick="playLocal('${data.url}')">
                        <span><i class="fa-solid fa-play"></i> ${data.name}</span>
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </div>`;
            }
        });
    }

    function playLocal(url) {
        // Stop SoundCloud if playing
        document.getElementById("sc-player").src = "";
        document.getElementById("sc-player").style.display = "none";
        
        audio.src = url;
        audio.play();
    }

    setInterval(() => { document.getElementById("sys-clock").innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
