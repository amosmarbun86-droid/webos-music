<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS OS V14 - DEBUGGED VERSION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =========================================
           SYSTEM ENGINE CORE - AMOS ROSARIO
           ========================================= */
        :root { 
            --matrix-color: #00ff9f; 
            --glow-shadow: 0 0 25px rgba(0, 255, 159, 0.6);
            --bg-glass: rgba(0, 10, 5, 0.98);
            --accent-red: #ff4d4d;
            --sidebar-width: 280px;
        }
        
        body { 
            margin:0; font-family: 'Consolas', 'Courier New', monospace; 
            background: #000; color: var(--matrix-color); 
            overflow:hidden; touch-action: manipulation; height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* BACKGROUND ENGINE (Z-INDEX: -1) */
        #bg-system { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; pointer-events:none; }
        .hacker-img { 
            position:absolute; top:0; left:0; width:100%; height:100%; 
            background-size:cover; background-position:center; 
            opacity:0; transition: opacity 2s ease-in-out;
        }
        .hacker-img.active { opacity:0.25; }
        #bgCanvas { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.2; }

        /* HEADER (Z-INDEX: 1000) */
        #header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.95); border-bottom: 1px solid var(--matrix-color); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 20px; z-index: 1000; box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .pulse { width: 10px; height: 10px; background: var(--matrix-color); border-radius: 50%; box-shadow: var(--glow-shadow); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* SECURITY GATE (Z-INDEX: 99999) - FIXED FOCUS ISSUE */
        #login-gate { 
            position:fixed; top:0; left:0; width:100%; height:100%; 
            background:#000; z-index:99999; display:flex; 
            justify-content:center; align-items:center; visibility: visible;
        }
        .login-box { 
            text-align:center; width:85%; max-width:350px; padding:40px; 
            border:2px solid var(--matrix-color); border-radius:30px; 
            box-shadow: var(--glow-shadow); background: #000;
            position: relative; z-index: 100000;
        }
        
        /* INPUT FIXED */
        #sys-pin { 
            background: rgba(0, 255, 159, 0.1); color: #fff; 
            border: 2px solid var(--matrix-color); padding: 20px; 
            border-radius: 15px; width: 100%; font-weight: bold; 
            margin-top: 25px; outline: none; text-align: center; 
            font-size: 24px; box-sizing: border-box;
            -webkit-user-select: text !important;
            user-select: text !important;
        }
        
        #btn-boot { 
            background: var(--matrix-color); color: #000; border: none; 
            padding: 18px; border-radius: 15px; width: 100%; 
            font-weight: 900; margin-top: 20px; cursor: pointer; 
            letter-spacing: 2px;
        }

        /* SIDEBAR (Z-INDEX: 5000) */
        #sidebar { 
            position: fixed; left: calc(var(--sidebar-width) * -1.1); top: 0; width: var(--sidebar-width); height: 100vh; 
            z-index: 5000; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 40px 25px; box-sizing: border-box; border-right: 1px solid var(--matrix-color);
            background-image: url('https://res.cloudinary.com/dkisbfx29/image/upload/v1777526733/nkiwvrz7xpxqbqvaunn5.png'); 
            background-size: cover; background-position: center;
        }
        #sidebar::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: -1; }
        #sidebar.active { transform: translateX(calc(var(--sidebar-width) + 10px)); }

        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4999; display: none; }
        #sidebar-overlay.active { display: block; }

        /* WINDOWS SYSTEM */
        .window { 
            position:fixed; top:10%; left:5%; width:90%; height:80%; 
            background: var(--bg-glass); border: 1px solid var(--matrix-color); 
            display:none; flex-direction:column; z-index:500; border-radius: 25px; 
            overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        .titlebar { background: rgba(0,255,159,0.1); padding: 15px 25px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--matrix-color); }
        .window-content { flex:1; padding:20px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* MUSIC ENGINE */
        .music-card { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px solid rgba(0,255,159,0.2); }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 20px 0; cursor: pointer; }
        #prog-fill { height: 100%; background: var(--matrix-color); width: 0%; border-radius: 5px; box-shadow: var(--glow-shadow); }

        /* FLOATING PLAYER */
        #floating-player { 
            position:fixed; bottom:30px; right:30px; width:70px; height:70px; 
            background:#000; border:2px solid var(--matrix-color); 
            border-radius:50%; display:none; justify-content:center; align-items:center; 
            z-index:9000; cursor:move; box-shadow: var(--glow-shadow);
        }
        #floating-player i { font-size:30px; animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div id="bg-system">
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1000')"></div>
    <div class="hacker-img" style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?w=1000')"></div>
    <canvas id="bgCanvas"></canvas>
</div>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-shield-halved" style="font-size:60px; color:var(--matrix-color)"></i>
        <h2 style="letter-spacing:4px; margin-top:15px;">CORE ACCESS</h2>
        <input type="password" id="sys-pin" placeholder="ENTER PIN" inputmode="numeric" autofocus>
        <button id="btn-boot" onclick="checkAuth()">LOGIN_SYSTEM</button>
        <p style="font-size:10px; margin-top:15px; opacity:0.5;">DEBUG_MODE: ENABLED</p>
    </div>
</div>

<div id="header">
    <div class="sys-status" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars" style="font-size:22px;"></i>
        <div class="pulse" style="display:inline-block; margin-left:10px;"></div>
    </div>
    <div style="font-weight:900; letter-spacing:4px;">AMOS_OS <span style="color:#fff">V14</span></div>
    <div id="clock" style="font-size:14px;">00:00:00</div>
</div>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <h3 style="color:#fff; border-bottom:1px solid var(--matrix-color); padding-bottom:15px;">DASHBOARD</h3>
    <div style="margin-top:20px;">
        <div style="padding:15px; cursor:pointer;" onclick="openWin('musicWin')"><i class="fa-solid fa-music"></i> MUSIC PLAYER</div>
        <div style="padding:15px; cursor:pointer;" onclick="openWin('fileWin')"><i class="fa-solid fa-folder-open"></i> FILE MANAGER</div>
        <div style="padding:15px; cursor:pointer; color:red; margin-top:50px;" onclick="location.reload()"><i class="fa-solid fa-power-off"></i> SHUTDOWN</div>
    </div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>MUSIC_ENGINE</span> <span onclick="closeWin('musicWin')">✕</span></div>
        <div class="window-content">
            <div class="music-card">
                <h4 id="track-title" style="text-align:center; margin:0;">No Track Loaded</h4>
                <div class="progress-bar" onclick="seek(event)"><div id="prog-fill"></div></div>
                <div style="display:flex; justify-content:center; gap:30px; font-size:30px;">
                    <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)"></i>
                    <i class="fa-solid fa-play" id="main-play" onclick="togglePlay()"></i>
                    <i class="fa-solid fa-forward-step" onclick="changeTrack(1)"></i>
                </div>
            </div>
            <div id="list-container" style="margin-top:20px;"></div>
            <input type="file" id="u-audio" style="display:none" onchange="uploadFile('audio')">
            <button onclick="document.getElementById('u-audio').click()" style="width:100%; margin-top:20px; background:none; border:1px dashed var(--matrix-color); color:var(--matrix-color); padding:10px;">+ UPLOAD MP3</button>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>FILE_STORAGE</span> <span onclick="closeWin('fileWin')">✕</span></div>
        <div class="window-content">
            <div id="file-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:15px;"></div>
        </div>
    </div>
</div>

<div id="floating-player" onclick="togglePlay()"><i class="fa-solid fa-compact-disc"></i></div>

<audio id="coreAudio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    /* =========================================
       SYSTEM SCRIPTS - DEBUGGED
       ========================================= */
    const fbConfig = { 
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0", 
        authDomain: "amos-web-os.firebaseapp.com", 
        projectId: "amos-web-os", 
        storageBucket: "amos-web-os.firebasestorage.app", 
        messagingSenderId: "59843745100", 
        appId: "1:59843745100:web:b29e5996052a3bf5672be9" 
    };
    firebase.initializeApp(fbConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("coreAudio");

    // AUTH FIX: PIN 101312
    function checkAuth() {
        const val = document.getElementById('sys-pin').value;
        if(val === "101312") {
            const gate = document.getElementById('login-gate');
            gate.style.opacity = "0";
            setTimeout(() => { 
                gate.style.display = "none"; 
                initSystem();
            }, 500);
        } else {
            alert("ACCESS DENIED!");
            document.getElementById('sys-pin').value = "";
        }
    }

    function initSystem() {
        loadFiles();
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
        }, 1000);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function openWin(id) {
        document.getElementById(id).style.display = "flex";
        toggleSidebar();
    }

    function closeWin(id) {
        document.getElementById(id).style.display = "none";
    }

    // MATRIX BG ENGINE
    const cvs = document.getElementById('bgCanvas');
    const ctx = cvs.getContext('2d');
    let w, h, columns, drops = [];
    function setupMatrix() {
        w = cvs.width = window.innerWidth;
        h = cvs.height = window.innerHeight;
        columns = Math.floor(w/20);
        for(let i=0; i<columns; i++) drops[i] = 1;
    }
    function drawMatrix() {
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#00ff9f";
        ctx.font = "15px monospace";
        for(let i=0; i<drops.length; i++) {
            const text = Math.floor(Math.random()*2);
            ctx.fillText(text, i*20, drops[i]*20);
            if(drops[i]*20 > h && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    window.onresize = setupMatrix;
    setupMatrix();
    setInterval(drawMatrix, 50);

    // SLIDESHOW ENGINE
    let imgs = document.querySelectorAll('.hacker-img'), currImg = 0;
    setInterval(() => {
        imgs.forEach(i => i.classList.remove('active'));
        imgs[currImg].classList.add('active');
        currImg = (currImg + 1) % imgs.length;
    }, 5000);

    // DATA SYNC
    let tracks = [];
    let currentIdx = 0;

    function loadFiles() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            const container = document.getElementById("list-container");
            const grid = document.getElementById("file-grid");
            container.innerHTML = ""; grid.innerHTML = "";
            tracks = [];
            
            snap.forEach(doc => {
                const data = doc.data();
                if(data.type === 'audio') {
                    tracks.push(data);
                    container.innerHTML += `<div style="padding:10px; border-bottom:1px solid #222; cursor:pointer;" onclick="playNow('${data.url}', '${data.name}')">${data.name}</div>`;
                }
                grid.innerHTML += `<div style="text-align:center; font-size:10px;"><i class="fa-solid fa-file" style="font-size:30px;"></i><br>${data.name.substring(0,10)}</div>`;
            });
        });
    }

    function playNow(url, name) {
        audio.src = url;
        audio.play();
        document.getElementById("track-title").innerText = name;
        document.getElementById("main-play").className = "fa-solid fa-pause";
        document.getElementById("floating-player").style.display = "flex";
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById("main-play").className = "fa-solid fa-pause"; }
        else { audio.pause(); document.getElementById("main-play").className = "fa-solid fa-play"; }
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
    };

    function seek(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        audio.currentTime = (x / rect.width) * audio.duration;
    }

    async function uploadFile(type) {
        const file = document.getElementById('u-audio').files[0];
        if(!file) return;
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "ml_default");
        
        try {
            const res = await fetch("https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload", { method: "POST", body: formData });
            const d = await res.json();
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
            alert("UPLOAD SUCCESS");
        } catch(e) { alert("UPLOAD FAILED"); }
    }

    // DRAG LOGIC
    const float = document.getElementById('floating-player');
    let isDragging = false, offset = [0,0];
    float.onmousedown = (e) => { isDragging = true; offset = [float.offsetLeft - e.clientX, float.offsetTop - e.clientY]; };
    document.onmousemove = (e) => { if(isDragging) { float.style.left = (e.clientX + offset[0]) + "px"; float.style.top = (e.clientY + offset[1]) + "px"; float.style.right="auto"; float.style.bottom="auto"; } };
    document.onmouseup = () => isDragging = false;
    
</script>
</body>
</html>
