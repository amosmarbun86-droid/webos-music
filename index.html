<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AMOS WEB OS V14 PRO - ULTIMATE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: #000; color:#00ff9f; overflow:hidden; touch-action: manipulation; }
        #bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.1; pointer-events:none; }
        
        button { cursor:pointer; background:rgba(0,255,159,0.1); color:#00ff9f; border:1px solid #00ff9f; padding:10px 15px; border-radius:8px; transition: 0.3s; font-size: 14px; }
        button:hover { background:#00ff9f; color:black; }
        input { background:#0a0a0a; color:#00ff9f; border:1px solid #004422; padding:12px; border-radius:8px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 10px; }

        /* WINDOWS SYSTEM */
        .window { position:fixed; top:10%; left:5%; width:90%; height:80%; background:rgba(0,10,15,0.98); border:1px solid #00ff9f44; display:none; flex-direction:column; z-index:100; border-radius: 20px; overflow: hidden; backdrop-filter: blur(20px); }
        .titlebar { background:rgba(0,255,159,0.1); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #00ff9f22; font-weight:bold; }
        .window-content { flex:1; padding:15px; overflow-y:auto; -webkit-overflow-scrolling: touch; }

        /* MUSIC PLAYER UI */
        .player-card { background: linear-gradient(180deg, rgba(0,255,159,0.1) 0%, transparent 100%); padding: 20px; border-radius: 15px; text-align: center; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; font-size: 24px; }
        .controls i { cursor: pointer; transition: 0.2s; }
        .controls i:active { color: #fff; transform: scale(1.2); }
        .play-btn { font-size: 45px !important; }
        .progress-container { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .progress-bar { flex: 1; height: 6px; background: #222; border-radius: 10px; cursor: pointer; overflow: hidden; }
        #prog-fill { width: 0%; height: 100%; background: #00ff9f; }
        .active-icon { color: #fff !important; text-shadow: 0 0 10px #00ff9f; }

        /* FILE MANAGER GRID */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .file-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; position: relative; border: 1px solid transparent; }
        .file-item i { font-size: 35px; display: block; margin-bottom: 8px; }
        .file-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .del-file { position: absolute; top: 5px; right: 5px; color: #ff4d4d; font-size: 12px; }

        /* HEADER & SIDEBAR */
        #header { position: fixed; top: 0; width: 100%; height: 50px; background: #000; border-bottom: 1px solid #00ff9f33; display: flex; align-items: center; padding: 0 15px; z-index: 1000; justify-content: space-between; box-sizing: border-box; }
        #sidebar { position: fixed; left: -260px; top: 0; width: 260px; height: 100vh; background: #050505; z-index: 2000; transition: 0.3s; padding: 20px; box-sizing: border-box; border-right: 1px solid #00ff9f22; }
        #sidebar.active { left: 0; }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; }
        .nav-link:active { background: rgba(0,255,159,0.2); }

        #login-gate { position:fixed; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000; z-index:9999; }
        .login-box { text-align: center; padding: 40px; border: 1px solid #00ff9f33; border-radius: 20px; width: 80%; max-width: 300px; }

        @media (min-width: 768px) {
            .window { width: 700px; height: 550px; top: 60px; left: 280px; }
            #sidebar { left: 0; }
            #header { display: none; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="login-gate">
    <div class="login-box">
        <i class="fa-solid fa-user-shield" style="font-size: 50px; color: #00ff9f; margin-bottom: 20px;"></i>
        <h2 style="letter-spacing: 5px; font-size: 18px; margin-bottom: 25px;">AMOS OS V14</h2>
        <input type="password" id="sys-pin" placeholder="Enter Credentials">
        <button onclick="unlock()" style="width: 100%;">LOGIN SYSTEM</button>
    </div>
</div>

<div id="header">
    <i class="fa-solid fa-bars" onclick="document.getElementById('sidebar').classList.toggle('active')"></i>
    <span style="font-weight: bold; letter-spacing: 2px;">AMOS_OS</span>
    <i class="fa-solid fa-clock" id="m-clock"></i>
</div>

<div id="sidebar">
    <div style="margin-bottom: 40px; border-bottom: 1px solid #00ff9f22; padding-bottom: 15px;">
        <h1 style="font-size: 18px;">AMOS<span style="color:#00ff9f;">_PRO</span></h1>
    </div>
    <div class="nav-link" onclick="openWin('musicWin')"><i class="fa-solid fa-music"></i> Music Player</div>
    <div class="nav-link" onclick="openWin('fileWin')"><i class="fa-solid fa-folder-open"></i> File Manager</div>
    <div class="nav-link" onclick="location.reload()" style="margin-top: 50px; color: #ff4d4d;"><i class="fa-solid fa-power-off"></i> Exit</div>
</div>

<div id="workspace">
    <div class="window" id="musicWin">
        <div class="titlebar"><span>MUSIC STORAGE PRO</span> <span onclick="closeWin('musicWin')">✕</span></div>
        <div class="window-content">
            <div style="background: rgba(0,255,159,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <p style="font-size: 12px; margin-bottom: 10px;">Tambah Lagu Baru:</p>
                <input type="file" id="mFile" style="display:none" onchange="uploadTrack('file')">
                <div style="display: flex; gap: 5px;">
                    <button onclick="document.getElementById('mFile').click()" style="flex:1"><i class="fa-solid fa-file-audio"></i> File</button>
                    <button onclick="addByLink()" style="flex:1"><i class="fa-solid fa-link"></i> Link URL</button>
                </div>
            </div>

            <div class="player-card">
                <h3 id="track-name" style="margin: 0; font-size: 16px;">Pilih Lagu...</h3>
                <div class="progress-container">
                    <span id="cur-t" style="font-size: 10px;">0:00</span>
                    <div class="progress-bar" onclick="seek(event)"><div id="prog-fill"></div></div>
                    <span id="dur-t" style="font-size: 10px;">0:00</span>
                </div>
                <div class="controls">
                    <i class="fa-solid fa-shuffle" id="shuf-btn" onclick="toggleShuffle()"></i>
                    <i class="fa-solid fa-backward-step" onclick="changeTrack(-1)"></i>
                    <i class="fa-solid fa-circle-play play-btn" id="play-btn" onclick="togglePlay()"></i>
                    <i class="fa-solid fa-forward-step" onclick="changeTrack(1)"></i>
                    <i class="fa-solid fa-repeat" id="rep-btn" onclick="toggleRepeat()"></i>
                </div>
            </div>

            <h4 style="border-bottom: 1px solid #00ff9f22; padding-bottom: 5px; margin-top: 20px;">Playlist Anda</h4>
            <div id="music-list"></div>
        </div>
    </div>

    <div class="window" id="fileWin">
        <div class="titlebar"><span>FILE MANAGER</span> <span onclick="closeWin('fileWin')">✕</span></div>
        <div class="window-content">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="file" id="fAny" style="display:none" onchange="uploadTrack('any')">
                <button onclick="document.getElementById('fAny').click()" style="flex:1">UPLOAD FILE</button>
                <button onclick="loadData()" style="flex:1">REFRESH</button>
            </div>
            <div class="file-grid" id="file-grid"></div>
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD2QRiYnyHWRqG3OgZcWV9YA1arXPsvoE0",
        authDomain: "amos-web-os.firebaseapp.com",
        projectId: "amos-web-os",
        storageBucket: "amos-web-os.firebasestorage.app",
        messagingSenderId: "59843745100",
        appId: "1:59843745100:web:b29e5996052a3bf5672be9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const audio = document.getElementById("audio");

    let songs = [];
    let curIdx = 0;
    let isShuffle = false;
    let isRepeat = false;

    function unlock() {
        if(document.getElementById("sys-pin").value === "101312") {
            document.getElementById("login-gate").style.display = "none";
            loadData();
        } else { alert("Akses Ditolak!"); }
    }

    function openWin(id) { 
        document.getElementById(id).style.display = "flex"; 
        if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
    }
    function closeWin(id) { document.getElementById(id).style.display = "none"; }

    // MUSIC ENGINE
    function loadData() {
        db.collection("files").orderBy("created", "desc").onSnapshot(snap => {
            songs = [];
            const mList = document.getElementById("music-list");
            const fGrid = document.getElementById("file-grid");
            mList.innerHTML = ""; fGrid.innerHTML = "";

            snap.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                
                if(d.type === 'audio') {
                    songs.push({id, ...d});
                    mList.innerHTML += `
                        <div class="nav-link" onclick="playSong('${id}')" style="justify-content:space-between">
                            <span><i class="fa-solid fa-play"></i> ${d.name}</span>
                            <i class="fa-solid fa-trash" style="color:red" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                        </div>`;
                }

                let icon = d.type === 'image' ? 'fa-file-image' : d.type === 'audio' ? 'fa-file-audio' : 'fa-file-pdf';
                fGrid.innerHTML += `
                    <div class="file-item" onclick="window.open('${d.url}')">
                        <i class="fa-solid ${icon}"></i>
                        <span class="file-name">${d.name}</span>
                        <i class="fa-solid fa-trash del-file" onclick="event.stopPropagation(); deleteF('${id}')"></i>
                    </div>`;
            });
        });
    }

    function playSong(id) {
        curIdx = songs.findIndex(s => s.id === id);
        start();
    }

    function start() {
        const s = songs[curIdx];
        audio.src = s.url;
        audio.play();
        document.getElementById("track-name").innerText = s.name;
        document.getElementById("play-btn").className = "fa-solid fa-circle-pause play-btn";
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); document.getElementById("play-btn").className = "fa-solid fa-circle-pause play-btn"; }
        else { audio.pause(); document.getElementById("play-btn").className = "fa-solid fa-circle-play play-btn"; }
    }

    function changeTrack(dir) {
        if(isShuffle && dir > 0) curIdx = Math.floor(Math.random() * songs.length);
        else curIdx = (curIdx + dir + songs.length) % songs.length;
        start();
    }

    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById("shuf-btn").classList.toggle("active-icon", isShuffle); }
    function toggleRepeat() { isRepeat = !isRepeat; audio.loop = isRepeat; document.getElementById("rep-btn").classList.toggle("active-icon", isRepeat); }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("prog-fill").style.width = p + "%";
        document.getElementById("cur-t").innerText = fmt(audio.currentTime);
        document.getElementById("dur-t").innerText = fmt(audio.duration);
    };

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; }
    function fmt(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0"+r:r); }
    audio.onended = () => { if(!isRepeat) changeTrack(1); };

    // UPLOAD LOGIC
    async function uploadTrack(mode) {
        const file = mode === 'file' ? document.getElementById("mFile").files[0] : document.getElementById("fAny").files[0];
        if(!file) return;
        
        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", "ml_default");

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/dkisbfx29/auto/upload`, { method: "POST", body: form });
            const d = await res.json();
            let type = file.type.includes("audio") ? "audio" : file.type.includes("image") ? "image" : "pdf";
            
            await db.collection("files").add({ name: file.name, url: d.secure_url, type: type, created: Date.now() });
            alert("Berhasil!");
        } catch(e) { alert("Gagal!"); }
    }

    async function addByLink() {
        const url = prompt("Masukkan Link URL Lagu (Direct Link MP3):");
        const name = prompt("Nama Lagu:");
        if(url && name) {
            await db.collection("files").add({ name: name, url: url, type: "audio", created: Date.now() });
        }
    }

    async function deleteF(id) { if(confirm("Hapus File?")) await db.collection("files").doc(id).delete(); }

    setInterval(() => { document.getElementById("m-clock").innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
